version: "0.2"
name: observatory
summary: >
  The Observatory: a read-only view of how your OpenRig machines are doing,
  with its own agent. The app runs as one container in its own Compose
  project; the agent sets it up, keeps it running and answers questions from
  what the app shows. It changes nothing outside the app.

services:
  kind: compose
  compose_file: observatory.compose.yaml
  project_name: openrig-observatory
  down_policy: down
  # The rig comes up when the studio answers. Whether the observatory provider behind it is serving is
  # a runtime reading, which the container healthcheck reports and the app's agent acts on; waiting on
  # it here would roll the whole rig back, agent included, on the very failure the agent is there to
  # handle. (A `service: studio, condition: healthy` wait would do exactly that, since the healthcheck
  # is provider-level, so there is none.)
  wait_for:
    - url: http://127.0.0.1:9440/api/contract
  surfaces:
    urls:
      - name: Observatory
        url: http://127.0.0.1:9440/surfaces/observatory.html
    commands:
      - name: Observatory status
        command: "rig env status observatory"
      - name: Observatory logs
        command: "rig env logs observatory studio --tail 100"

pods:
  - id: observatory
    label: Observatory
    members:
      - id: operator
        agent_ref: "local:../agents/starter-ops"
        runtime: claude-code
        profile: default
        cwd: "."
        startup:
          files:
            - path: observatory-startup.md
              delivery_hint: send_text
              required: true
    edges: []

edges: []
