version: "0.2"
name: observatory
summary: >
  The Observatory: a read-only view of how your OpenRig machines are doing,
  with its own agent. The app runs as one container in its own Compose
  project; the agent sets it up, keeps it running and answers questions from
  what the app shows. It changes nothing outside the app.

services:
  kind: compose
  compose_file: observatory.compose.yaml
  project_name: openrig-observatory
  down_policy: down
  wait_for:
    - url: http://127.0.0.1:9440/api/contract
    - service: studio
      condition: healthy
  surfaces:
    urls:
      - name: Observatory
        url: http://127.0.0.1:9440/surfaces/observatory.html
    commands:
      - name: Observatory status
        command: "rig env status observatory"
      - name: Observatory logs
        command: "rig env logs observatory studio --tail 100"

pods:
  - id: observatory
    label: Observatory
    members:
      - id: operator
        agent_ref: "local:agents/observatory-operator"
        runtime: claude-code
        profile: default
        cwd: "."
    edges: []

edges: []
