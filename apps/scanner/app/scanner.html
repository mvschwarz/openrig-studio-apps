<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner</title>
  <style>
    /* Same tokens as FLOOR, EFFECTS and PROVIDERS. */
    :root {
      --bg:#0b0f14; --panel:#121a22; --panel2:#0f161d; --line:#1f2a35;
      --ink:#dbe4ec; --dim:#94a5b6; --faint:#6b7c8d; --accent:#4ade9b; --flag:#d99a2b;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display:grid; grid-template-columns: 1fr 360px; height:100vh; overflow:hidden;
    }
    @media (max-width: 940px) { body { grid-template-columns:1fr; overflow:auto; height:auto; } }
    main { padding:16px; display:flex; flex-direction:column; gap:12px; min-width:0; overflow:auto; }
    aside { border-left:1px solid var(--line); background:var(--panel2); padding:16px;
            display:flex; flex-direction:column; gap:12px; overflow:auto; }
    h1 { font-family:var(--mono); font-size:18px; margin:0; letter-spacing:-0.02em; font-weight:600; }
    .eyebrow { font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
    .cap { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
    /* STACKED, not side by side. A signal chain reads perfectly well top-to-bottom,
       and on a tall screen it lets every bed be full width instead of a thumbnail —
       which matters here because the thing you are judging is the PICTURE. */
    .chain { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
    .node { display:flex; flex-direction:column; gap:4px; min-width:0; width:100%; }
    .frame { position:relative; border:1px solid var(--line); border-radius:4px; background:#000; overflow:hidden; }
    .node.final .frame { border-color:var(--accent); }
    canvas { display:block; width:100%; height:auto; }
    .arrow { align-self:center; color:var(--faint); font-family:var(--mono); font-size:15px; line-height:1; }
    .transport { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    button, select { font-family:var(--mono); font-size:12px; padding:6px 10px; border-radius:3px;
      border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; }
    button:hover { border-color:var(--accent); color:var(--ink); }
    button.on { color:var(--accent); border-color:var(--accent); }
    button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:4px;
            padding:12px 13px; display:flex; flex-direction:column; gap:8px; }
    .card h2 { font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
               color:var(--accent); margin:0; display:flex; justify-content:space-between; gap:8px; }
    .card h2 .sub { color:var(--faint); letter-spacing:.06em; }
    .row { display:grid; grid-template-columns:1fr 56px; gap:6px; align-items:center; }
    .row label { font-size:12px; color:var(--dim); }
    .row .val { font-family:var(--mono); font-size:11px; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
    .row .val.driven { color:var(--accent); }
    input[type=range] { width:100%; accent-color:var(--accent); }
    select.full { width:100%; }
    .status { font-family:var(--mono); font-size:11px; color:var(--faint); min-height:1.3em; }
    .err { font-family:var(--mono); font-size:11px; color:var(--flag); }
    textarea { width:100%; min-height:190px; font-family:var(--mono); font-size:11px; line-height:1.5;
      background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:3px; padding:8px; resize:vertical; }
    .meta { font-family:var(--mono); font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
    .hint { font-size:11.5px; color:var(--faint); line-height:1.45; }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="eyebrow">Studio</div>
      <h1>Scanner</h1>
    </div>
    <div class="chain" id="chain"></div>
    <div class="transport">
      <button id="rec">record</button>
      <button id="clear">clear</button>
      <button id="save">save final</button>
      <select id="source"><option value="">— source —</option></select>
      <select id="preset"><option value="">— chain preset —</option></select>
    </div>
    <div class="status" id="status">ready</div>
    <div class="err" id="error"></div>
    <div class="meta" id="meta"></div>
  </main>

  <aside>
    <div class="card">
      <h2>Chain spec</h2>
      <textarea id="spec" spellcheck="false"></textarea>
      <div class="transport"><button id="compile">compile + load</button></div>
      <div class="status" id="specnote">the spec is the complete surface</div>
    </div>
    <div class="card">
      <h2>Steering <span class="sub" id="steermode">load-bearing only</span></h2>
      <p class="hint">Controls shown are the ones this chain is actually using — driven by a lane, or moved off their default. Everything else exists and is reachable from the spec.</p>
      <div class="transport"><button id="showall">show every control</button></div>
    </div>
    <div id="groups"></div>
  </aside>

<script type="module">
const $ = (s) => document.querySelector(s);
const statusEl = $('#status'), errEl = $('#error'), metaEl = $('#meta');
const say  = (m) => { statusEl.textContent = m; };
const fail = (m) => { errEl.textContent = m; };

// One GL context, on an offscreen canvas. Each stage's tape is a texture in it;
// the on-screen canvases are 2D and get blitted per frame. That keeps N stages
// from needing N WebGL contexts, which browsers cap aggressively.
const glc = document.createElement('canvas');
const OUT_W = 960, OUT_H = 400;
glc.width = OUT_W; glc.height = OUT_H;
const gl = glc.getContext('webgl2', { preserveDrawingBuffer: true });
if (!gl) fail('this browser has no WebGL2 — the recording cannot be drawn');

const UNIT_SRC = 0, UNIT_PREV = 1, UNIT_TAPE = 2;

let PARAMS = {}, PRESETS = {};
let vid = document.createElement('video');
vid.muted = true; vid.loop = true; vid.playsInline = true; vid.crossOrigin = 'anonymous';
let srcEl = null, isVideo = false, srcTex = null, srcW = 0, srcH = 0, lastStamp = NaN;
let writeProg = null, blitProg = null, fadeProg = null;
let recording = false, scanTime = 0, lastWall = 0, rafId = null, duration = 12;
let stepCount = 0, wallStart = 0, showAll = false;

// clocks: name -> {rate} | {rateTrack}. clockT accumulates each clock's OWN
// time, which is the integral of its rate — so a rate that is itself a lane
// makes time ACCELERATE rather than merely run fast.
let clocks = { master: { rate: 1 } }, clockT = { master: 0 };
let stages = [];

// ---- lanes ---------------------------------------------------------------
function evalTrack(kfs, t) {
  if (!kfs || !kfs.length) return null;
  if (t <= kfs[0].t) return kfs[0].v;
  if (t >= kfs[kfs.length-1].t) return kfs[kfs.length-1].v;
  for (let i=0;i<kfs.length-1;i++) {
    const a=kfs[i], b=kfs[i+1];
    if (t>=a.t && t<=b.t) {
      if (typeof a.v !== 'number') return a.v;
      const span=b.t-a.t; let u = span<=0?1:(t-a.t)/span;
      const e = b.ease||a.ease||'smooth';
      if (e==='snap') u = u<1?0:1; else if (e==='smooth') u = u*u*(3-2*u);
      return a.v + (b.v-a.v)*u;
    }
  }
  return kfs[kfs.length-1].v;
}
function clockRate(name) {
  const c = clocks[name] || clocks.master;
  if (c.rateTrack) { const v = evalTrack(c.rateTrack, scanTime); return v === null ? 1 : v; }
  return c.rate ?? 1;
}
// A transport's parameters are evaluated against ITS clock, not the master.
function effectiveFor(st) {
  const P = { ...st.params };
  for (const [k, kfs] of Object.entries(st.tracks || {})) {
    const which = k.startsWith('bed') ? st.clocks.bed
                : k.startsWith('head') ? st.clocks.head
                : st.clocks.write;
    const v = evalTrack(kfs, clockT[which] ?? scanTime);
    if (v !== null) P[k] = v;
  }
  return P;
}

// ---- gl helpers ----------------------------------------------------------
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(`shader did not compile: ${gl.getShaderInfoLog(s)}`);
  return s;
}
function build(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`program did not link: ${gl.getProgramInfoLog(p)}`);
  return p;
}
function mkTex(unit, w, h) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  return t;
}

// ---- source --------------------------------------------------------------
function uploadSource() {
  if (!srcEl) return;
  const w = isVideo ? vid.videoWidth : (srcEl.naturalWidth||srcEl.width);
  const h = isVideo ? vid.videoHeight : (srcEl.naturalHeight||srcEl.height);
  if (!w || !h) return;
  if (!srcTex || srcW!==w || srcH!==h) { srcW=w; srcH=h; srcTex = mkTex(UNIT_SRC,w,h); }
  gl.activeTexture(gl.TEXTURE0+UNIT_SRC); gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE, isVideo?vid:srcEl);
}

// ---- a stage -------------------------------------------------------------
function makeStage(def, index) {
  const st = {
    id: def.id, from: def.from, clocks: def.clocks,
    params: Object.assign({}, defaults(), def.constants || {}),
    tracks: def.tracks || {}, source: def.source || {},
    writeAt: 0, tex: null, fbo: null, prevTex: null, prevFbo: null, prevW: 0, prevH: 0,
    canvas: null, ctx: null, index,
  };
  st.tex = mkTex(UNIT_TAPE, OUT_W, OUT_H);
  st.fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, st.tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return st;
}
function defaults() {
  const d = {};
  for (const [k,s] of Object.entries(PARAMS)) d[k] = s.default;
  return d;
}
// What this stage reads: an earlier stage's tape, or the clip.
function sourceFor(st) {
  if (!st.from) return { tex: srcTex, w: srcW, h: srcH };
  const up = stages.find((s) => s.id === st.from);
  return up ? { tex: up.tex, w: OUT_W, h: OUT_H } : { tex: srcTex, w: srcW, h: srcH };
}
// The one-step history this stage's motion/difference reads. Kept per stage,
// because an upstream tape changes on its own schedule and the clip on another.
function keepPrev(st, src) {
  if (!src.tex || !src.w) return false;
  if (!st.prevTex || st.prevW !== src.w || st.prevH !== src.h) {
    st.prevW = src.w; st.prevH = src.h;
    st.prevTex = mkTex(UNIT_PREV, src.w, src.h);
    if (!st.prevFbo) st.prevFbo = gl.createFramebuffer();
    return false;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, st.prevFbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, src.tex, 0);
  gl.activeTexture(gl.TEXTURE0+UNIT_PREV); gl.bindTexture(gl.TEXTURE_2D, st.prevTex);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  if (ok) gl.copyTexSubImage2D(gl.TEXTURE_2D,0,0,0,0,0,src.w,src.h);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return ok;
}

function writeStage(st, P) {
  const src = sourceFor(st);
  if (!src.tex || !writeProg) return;
  const vertical = (P.axis||'vertical') === 'vertical';
  const wpx = Math.max(1, Math.round(P.headWidth||6));
  const span = vertical ? OUT_W : OUT_H;
  const at = Math.round(((st.writeAt % 1 + 1) % 1) * span);

  gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
  gl.viewport(0,0,OUT_W,OUT_H);
  gl.enable(gl.SCISSOR_TEST);
  if (vertical) gl.scissor(at,0,wpx,OUT_H); else gl.scissor(0,at,OUT_W,wpx);
  gl.useProgram(writeProg);
  const u = (n) => gl.getUniformLocation(writeProg, n);
  gl.activeTexture(gl.TEXTURE0+UNIT_SRC);  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(u('uSrc'), UNIT_SRC);
  gl.activeTexture(gl.TEXTURE0+UNIT_PREV); gl.bindTexture(gl.TEXTURE_2D, st.prevTex || src.tex);
  gl.uniform1i(u('uPrev'), UNIT_PREV);
  gl.uniform2f(u('uOut'), OUT_W, OUT_H);
  gl.uniform2f(u('uSrcSize'), src.w||1, src.h||1);
  gl.uniform1f(u('uAxis'), vertical?0:1);
  gl.uniform1f(u('uHeadAt'), P.headPosition ?? 0);
  gl.uniform1f(u('uHeadWidth'), wpx);
  gl.uniform1f(u('uHeadAngle'), P.headAngle||0);
  gl.uniform1f(u('uSoftness'), P.headSoftness||0);
  gl.uniform2f(u('uBedPos'), P.bedX||0, P.bedY||0);
  gl.uniform1f(u('uBedRot'), (P.bedRotate||0)*Math.PI/180);
  gl.uniform1f(u('uBedScale'), P.bedScale ?? 1);
  gl.uniform1f(u('uRead'), Math.max(0,(PARAMS.read?.values||[]).indexOf(P.read ?? 'passthrough')));
  gl.uniform1f(u('uWriteMode'), Math.max(0,(PARAMS.writeMode?.values||[]).indexOf(P.writeMode ?? 'direct')));
  gl.uniform1f(u('uGain'), P.gain ?? 1);
  gl.uniform1f(u('uBias'), P.bias||0);
  gl.uniform1f(u('uThreshold'), P.threshold||0);
  gl.uniform1f(u('uInvert'), P.invert?1:0);
  const tc = P.targetColor || '#c84a2a';
  gl.uniform3f(u('uTarget'), parseInt(tc.slice(1,3),16)/255, parseInt(tc.slice(3,5),16)/255, parseInt(tc.slice(5,7),16)/255);
  gl.uniform1f(u('uPalette'), Math.max(0,(PARAMS.palette?.values||[]).indexOf(P.palette ?? 'ember')));
  gl.uniform1f(u('uDisplace'), P.displace ?? 40);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.disable(gl.SCISSOR_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function blitTo(st) {
  if (!blitProg || !st.ctx) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.disable(gl.SCISSOR_TEST);
  gl.viewport(0,0,OUT_W,OUT_H);
  gl.useProgram(blitProg);
  gl.activeTexture(gl.TEXTURE0+UNIT_TAPE); gl.bindTexture(gl.TEXTURE_2D, st.tex);
  gl.uniform1i(gl.getUniformLocation(blitProg,'t'), UNIT_TAPE);
  gl.uniform2f(gl.getUniformLocation(blitProg,'r'), OUT_W, OUT_H);
  gl.drawArrays(gl.TRIANGLES,0,3);
  st.ctx.drawImage(glc, 0, 0, st.canvas.width, st.canvas.height);
}
function clearAll() {
  for (const st of stages) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, st.fbo);
    gl.disable(gl.SCISSOR_TEST); gl.viewport(0,0,OUT_W,OUT_H);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    st.writeAt = 0;
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  scanTime = 0; for (const k of Object.keys(clockT)) clockT[k] = 0;
  for (const st of stages) blitTo(st);
}

// ---- the bed preview -----------------------------------------------------
let bedCanvas = null, bedCtx = null;
function drawBed(P) {
  if (!bedCtx) return;
  const w = bedCanvas.width, h = bedCanvas.height;
  bedCtx.fillStyle = '#000'; bedCtx.fillRect(0,0,w,h);
  if (srcEl) {
    bedCtx.save();
    bedCtx.translate(w/2 + (P.bedX||0)*(w/(srcW||w)), h/2 + (P.bedY||0)*(h/(srcH||h)));
    bedCtx.rotate((P.bedRotate||0)*Math.PI/180);
    bedCtx.scale(P.bedScale ?? 1, P.bedScale ?? 1);
    try { bedCtx.drawImage(isVideo?vid:srcEl, -w/2,-h/2,w,h); }
    catch (e) { fail(`the bed could not draw the source: ${e.message}`); }
    bedCtx.restore();
  }
  const vertical = (P.axis||'vertical')==='vertical';
  const at = P.headPosition ?? 0;
  bedCtx.strokeStyle = '#4ade9b'; bedCtx.lineWidth = 2;
  bedCtx.shadowColor = '#4ade9b'; bedCtx.shadowBlur = 10;
  bedCtx.beginPath();
  if (vertical) { bedCtx.moveTo(at*w,0); bedCtx.lineTo(at*w,h); }
  else { bedCtx.moveTo(0,at*h); bedCtx.lineTo(w,at*h); }
  bedCtx.stroke(); bedCtx.shadowBlur = 0;
}

// ---- the loop ------------------------------------------------------------
function tick(now) {
  rafId = requestAnimationFrame(tick);
  uploadSource();
  if (stages[0]) drawBed(effectiveFor(stages[0]));
  if (!recording) { lastWall = 0; stepCount = 0; wallStart = 0; return; }

  const dt = lastWall ? Math.min(0.1, (now-lastWall)/1000) : 0;
  lastWall = now;
  scanTime += dt;
  for (const name of Object.keys(clocks)) {
    clockT[name] = (clockT[name] ?? 0) + clockRate(name)*dt;
  }

  // STAGES IN ORDER, because a later stage reads an earlier one's tape and must
  // see this frame's version of it, not last frame's.
  for (const st of stages) {
    const P = effectiveFor(st);
    const src = sourceFor(st);
    // Roll this stage's history only when its source actually changed — for the
    // clip that is the video clock, for a chained stage it is every step.
    if (!st.from) { const s = isVideo ? vid.currentTime : 0;
      if (s !== lastStamp) keepPrev(st, src); }
    else keepPrev(st, src);
    const span = ((P.axis||'vertical')==='vertical') ? OUT_W : OUT_H;
    const adv = (P.advance === 0) ? (duration>0 ? span/(duration*60) : 1) : (P.advance ?? 1);
    st.writeAt += adv * (dt*60) / span;
    if (st.writeAt >= 1) st.writeAt -= 1;
    if (st.writeAt < 0) st.writeAt += 1;
    writeStage(st, P);
    blitTo(st);
  }
  if (isVideo) lastStamp = vid.currentTime;

  stepCount++;
  if (!wallStart) wallStart = now;
  const wallSec = (now-wallStart)/1000;
  const fps = wallSec>0.5 ? stepCount/wallSec : null;
  const last = stages[stages.length-1];
  metaEl.textContent =
    `scanTime ${scanTime.toFixed(2)}s / ${duration}s · ${stages.length} stage${stages.length===1?'':'s'} · ` +
    `final write ${((last?.writeAt||0)*100).toFixed(1)}% · ` +
    Object.keys(clocks).map((c)=>`${c} ${(clockT[c]||0).toFixed(1)}s`).join(' · ') +
    (fps ? ` · ${fps.toFixed(1)} steps/s` : ' · warming up');
  if (duration && scanTime >= duration) setRecording(false, 'reached the spec duration');
}
function setRecording(on, why) {
  recording = on;
  $('#rec').textContent = on ? 'pause' : 'record';
  $('#rec').classList.toggle('on', on);
  const P = stages[0] ? effectiveFor(stages[0]) : {};
  if (isVideo) {
    const r = P.sourceRate ?? 1;
    if (on && r !== 0) { vid.playbackRate = Math.max(0.0625, Math.min(16, Math.abs(r))); vid.play().catch(()=>{}); }
    else vid.pause();
  }
  say(why || (on ? 'recording' : 'paused'));
}

// ---- the chain panels ----------------------------------------------------
function buildChain() {
  const host = $('#chain'); host.innerHTML = '';
  const bedNode = document.createElement('div'); bedNode.className = 'node';
  bedNode.innerHTML = '<span class="cap">Bed — source + head</span>';
  const bf = document.createElement('div'); bf.className = 'frame';
  bedCanvas = document.createElement('canvas'); bedCanvas.width = 960; bedCanvas.height = 400;
  bedCtx = bedCanvas.getContext('2d'); bf.appendChild(bedCanvas); bedNode.appendChild(bf);
  host.appendChild(bedNode);

  stages.forEach((st, i) => {
    const a = document.createElement('div'); a.className='arrow'; a.textContent='↓'; host.appendChild(a);
    const n = document.createElement('div');
    n.className = 'node' + (i === stages.length-1 ? ' final' : '');
    const readsFrom = st.from ? `reads ${st.from}` : 'reads the clip';
    n.innerHTML = `<span class="cap">${i===stages.length-1?'FINAL — ':''}${st.id} · ${readsFrom}</span>`;
    const f = document.createElement('div'); f.className='frame';
    const c = document.createElement('canvas');
    c.width = OUT_W; c.height = OUT_H;   // CSS scales it; one internal size for all
    st.canvas = c; st.ctx = c.getContext('2d');
    f.appendChild(c); n.appendChild(f); host.appendChild(n);
  });
}

// ---- steering: the LEGIBLE subset, derived not hand-listed ---------------
//
// The spec is the complete surface. This panel is not a mirror of it — it shows
// the controls this chain is ACTUALLY using: anything a lane drives, and
// anything moved off its default. Everything else still exists and is reachable
// from the spec, which is where the agent works. Generalises the highlight idea
// from "which sliders matter for this preset" to "which matter for this chain".
function loadBearing(st) {
  const out = new Set(['read', 'writeMode', 'headPosition', 'advance']);
  for (const k of Object.keys(st.tracks || {})) out.add(k);
  for (const [k,v] of Object.entries(st.params)) {
    const d = PARAMS[k]?.default;
    if (d !== undefined && v !== d) out.add(k);
  }
  return out;
}
function buildControls() {
  const host = $('#groups'); host.innerHTML = '';
  $('#steermode').textContent = showAll ? 'every control' : 'load-bearing only';
  for (const st of stages) {
    const keys = showAll ? Object.keys(PARAMS) : [...loadBearing(st)];
    const card = document.createElement('div'); card.className='card';
    const h = document.createElement('h2');
    h.innerHTML = `<span>${st.id}</span><span class="sub">${st.from?'← '+st.from:'← clip'} · bed:${st.clocks.bed} head:${st.clocks.head}</span>`;
    card.appendChild(h);
    for (const k of keys) {
      const s = PARAMS[k]; if (!s) continue;
      const driven = !!(st.tracks && st.tracks[k]);
      const row = document.createElement('div'); row.className='row';
      const lab = document.createElement('label'); lab.textContent = k; lab.title = s.says||'';
      row.appendChild(lab);
      if (s.type === 'enum') {
        const sel = document.createElement('select'); sel.className='full';
        for (const v of s.values) { const o=document.createElement('option'); o.value=o.textContent=v; sel.appendChild(o); }
        sel.value = st.params[k]; sel.onchange = () => { st.params[k]=sel.value; };
        card.appendChild(lab); card.appendChild(sel); continue;
      }
      if (s.type === 'bool') {
        const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!!st.params[k];
        cb.onchange=()=>{ st.params[k]=cb.checked; }; row.appendChild(cb); card.appendChild(row); continue;
      }
      if (s.type === 'color') {
        const ci=document.createElement('input'); ci.type='color'; ci.value=st.params[k]||'#c84a2a';
        ci.oninput=()=>{ st.params[k]=ci.value; }; row.appendChild(ci); card.appendChild(row); continue;
      }
      const val=document.createElement('span'); val.className='val'+(driven?' driven':'');
      val.textContent = driven ? 'lane' : (+st.params[k]).toFixed(2);
      row.appendChild(val); card.appendChild(row);
      if (!driven) {
        const inp=document.createElement('input'); inp.type='range';
        inp.min=s.min; inp.max=s.max; inp.step=(s.max-s.min)/200; inp.value=st.params[k];
        inp.oninput=()=>{ st.params[k]=+inp.value; val.textContent=(+inp.value).toFixed(2); };
        card.appendChild(inp);
      }
    }
    host.appendChild(card);
  }
}

// ---- source loading ------------------------------------------------------
async function useSource(rel) {
  errEl.textContent = '';
  if (!rel) return;
  isVideo = /\.(mp4|mov|webm|m4v)$/i.test(rel);
  if (isVideo) {
    vid.src = `/media/${encodeURIComponent(rel)}`; vid.load();
    await new Promise((r) => {
      let done=false; const fin=()=>{ if(!done){done=true;r();} };
      if (vid.readyState>=2) return fin();
      vid.addEventListener('loadeddata',fin,{once:true});
      vid.addEventListener('error',()=>{fail(`could not load ${rel}`);fin();},{once:true});
      setTimeout(fin,5000);
    });
    if (vid.readyState<2) { try { await vid.play(); vid.pause(); } catch(e){} }
    srcEl = vid;
  } else {
    const im=new Image(); im.src=`/media/${encodeURIComponent(rel)}`;
    await new Promise((r)=>{ im.onload=r; im.onerror=()=>{fail(`could not load ${rel}`);r();}; });
    srcEl=im; isVideo=false;
  }
  lastStamp = NaN; clearAll(); say(`loaded ${rel}`);
}

// ---- spec ----------------------------------------------------------------
const DEFAULT_SPEC = `{
  "scan": { "duration": "16s" },
  "clocks": { "drift": { "rate": 1.09 } },
  "output": { "when-full": "wrap" },
  "stages": [
    { "id": "a",
      "source": { "clip": "", "rate": 1 },
      "bed":  { "clock": "drift" },
      "head": { "axis": "vertical", "position": { "ramp": [0, 1] }, "width": 5 },
      "response": { "read": "passthrough" },
      "write": { "mode": "direct", "advance": 0 } },
    { "id": "b",
      "source": { "from": "a" },
      "head": { "axis": "horizontal", "position": { "ramp": [0, 1] }, "width": 5 },
      "response": { "read": "edge", "gain": 1.1 },
      "write": { "mode": "palette", "palette": "cold", "advance": 0 } }
  ]
}`;

async function loadSpec(text) {
  errEl.textContent = '';
  let spec;
  try { spec = typeof text === 'string' ? JSON.parse(text) : text; }
  catch (e) { return fail(`spec is not valid JSON: ${e.message}`); }
  const res = await (await fetch('/api/scanner/compile', {
    method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(spec) })).json();
  if (!res.ok) return fail(res.error || 'compile failed');
  duration = res.duration;
  clocks = res.clocks; clockT = {}; for (const k of Object.keys(clocks)) clockT[k]=0;
  stages = res.stages.map((d,i)=>makeStage(d,i));
  buildChain(); buildControls(); clearAll();
  const lanes = stages.reduce((n,s)=>n+Object.keys(s.tracks||{}).length,0);
  $('#specnote').textContent =
    `compiled — ${stages.length} stage${stages.length===1?'':'s'}, ` +
    `${Object.keys(clocks).length} clock${Object.keys(clocks).length===1?'':'s'}, ${lanes} lane${lanes===1?'':'s'}, ${duration}s`;
  if (res.problems?.length) fail(res.problems.join(' · '));
  const clip = spec.stages?.[0]?.source?.clip ?? spec.source?.clip;
  if (clip) { $('#source').value = clip; await useSource(clip); }
}

// ---- drive channel -------------------------------------------------------
let driveSeen=-1, driveBoot=null;
async function applyDrive(op) {
  if (op.spec) { $('#spec').value = typeof op.spec==='string'?op.spec:JSON.stringify(op.spec,null,2);
    await loadSpec($('#spec').value); }
  if (op.source !== undefined) { $('#source').value = op.source||''; await useSource(op.source||''); }
  if (op.preset) { const p = PRESETS[op.preset]; if (p) { $('#spec').value = JSON.stringify(p,null,2); await loadSpec(p); } }
  if (op.params) { const t = op.stage ? stages.find(s=>s.id===op.stage) : stages[0];
    if (t) { Object.assign(t.params, op.params); buildControls(); } }
  if (op.clear) clearAll();
  if (op.record !== undefined) setRecording(!!op.record);
  if (op.say) say(op.say);
}
async function pollDrive() {
  for(;;) {
    try {
      const r = await (await fetch('/api/effects/drive')).json();
      if (driveBoot===null) driveBoot=r.boot;
      else if (r.boot && r.boot!==driveBoot) { location.reload(); return; }
      if (r.op && r.op.scanner && r.gen!==driveSeen) { driveSeen=r.gen; await applyDrive(r.op.scanner); }
    } catch(e) {}
    await new Promise((res)=>setTimeout(res,350));
  }
}

async function boot() {
  try {
    const r = await (await fetch('/api/scanner/params')).json();
    PARAMS = r.params; PRESETS = r.presets;
    const w = await (await fetch('/api/scanner/shader?pass=write')).json();
    if (!w.ok) throw new Error(w.error||'no write shader');
    writeProg = build(w.vertex, w.fragment);
    const f = await (await fetch('/api/scanner/shader?pass=fade')).json();
    if (f.ok) fadeProg = build(f.vertex, f.fragment);
    blitProg = build(
      `#version 300 es
       void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.0-1.0,0.,1.); }`,
      `#version 300 es
       precision highp float; out vec4 o; uniform sampler2D t; uniform vec2 r;
       void main(){ o=vec4(texture(t, gl_FragCoord.xy/r).rgb,1.0); }`);

    const s = await (await fetch('/api/effects/sources')).json();
    const sel = $('#source');
    for (const fn of s.sources||[]) { const o=document.createElement('option'); o.value=o.textContent=fn; sel.appendChild(o); }
    sel.onchange = () => useSource(sel.value);
    const ps = $('#preset');
    for (const n of Object.keys(PRESETS)) { const o=document.createElement('option'); o.value=o.textContent=n; ps.appendChild(o); }
    ps.onchange = async () => { const p=PRESETS[ps.value]; if (p) { $('#spec').value=JSON.stringify(p,null,2); await loadSpec(p); } };

    $('#spec').value = DEFAULT_SPEC;
    $('#compile').onclick = () => loadSpec($('#spec').value);
    $('#showall').onclick = () => { showAll = !showAll; buildControls();
      $('#showall').textContent = showAll ? 'show only what matters' : 'show every control'; };
    $('#rec').onclick = () => setRecording(!recording);
    $('#clear').onclick = () => { clearAll(); say('tapes cleared'); };
    $('#save').onclick = () => { const last = stages[stages.length-1];
      if (!last) return; const a=document.createElement('a');
      a.download=`scan-${Date.now()}.png`; a.href=last.canvas.toDataURL('image/png'); a.click(); say('final saved'); };

    await loadSpec(DEFAULT_SPEC);
    rafId = requestAnimationFrame(tick);
    pollDrive();
    say('ready — pick a source, then record');
  } catch (e) { fail(`could not start: ${e.message}`); }
}

// The agent surface: complete, unlike the panel.
window.scanner = {
  stages: () => stages.map((s)=>({ id:s.id, from:s.from, clocks:s.clocks,
                                   params:s.params, lanes:Object.keys(s.tracks||{}), writeAt:s.writeAt })),
  clocks: () => ({ defs: clocks, now: clockT }),
  effective: (id) => { const s = id ? stages.find(x=>x.id===id) : stages[0]; return s ? effectiveFor(s) : null; },
  set: (id, p) => { const s = typeof id==='string' ? stages.find(x=>x.id===id) : stages[0];
                    const q = typeof id==='string' ? p : id;
                    if (s) { Object.assign(s.params, q); buildControls(); } },
  spec: (t) => loadSpec(t),
  record: (on) => setRecording(on),
  clear: () => clearAll(),
  scanTime: () => scanTime,
  params: () => PARAMS,
};
boot();
</script>
