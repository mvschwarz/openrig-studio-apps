<!doctype html>
<meta charset="utf-8">
<title>DESIGNER</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* Tokens taken from the FILES app rather than invented, so this reads as part
     of the same product. Monospace is confined to the spec panel, where it is
     genuinely code — the terminal look everywhere else was the thing to move
     away from, not a house style to match. */
  :root{
    --bg:#121214; --fg:rgba(255,255,255,.95); --body:rgba(255,255,255,.68);
    --dim:rgba(255,255,255,.52); --faint:rgba(255,255,255,.38);
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.16);
    --card:rgba(255,255,255,.07); --coral:#ff6b5a; --indigo:#8b93ff;
    --sans:Helvetica,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:var(--sans); font-size:13.5px;
  }
  body::before{content:""; position:fixed; inset:-10%; z-index:0; pointer-events:none;
    background:radial-gradient(42% 55% at 18% 22%, rgba(139,147,255,.08), transparent 70%),
               radial-gradient(38% 50% at 82% 8%, rgba(255,107,90,.05), transparent 72%)}
  body>*{position:relative; z-index:1}

  header{padding:26px 30px 16px; border-bottom:1px solid var(--line)}
  .eyebrow{color:var(--dim); font-size:9px; letter-spacing:.18em; text-transform:uppercase; font-weight:600}
  h1{margin:6px 0 3px; font:600 clamp(26px,4vw,40px)/1.05 var(--sans); letter-spacing:-.025em}
  .sub{color:var(--body); font-size:13px; max-width:62ch}

  .wrap{display:grid; grid-template-columns:1fr 360px}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  main{padding:22px 30px 48px; min-width:0}
  aside{padding:22px 26px 48px; border-left:1px solid var(--line); position:sticky; top:0}
  @media (max-width:900px){aside{border-left:0; border-top:1px solid var(--line); position:static}}

  .rig{border:1px solid var(--line); border-radius:14px; background:var(--card); padding:18px}
  .rigname{font:600 19px/1.2 var(--sans); letter-spacing:-.02em}
  .rigmeta{color:var(--dim); font-size:11px; margin-top:3px}
  .pods{display:flex; flex-wrap:wrap; gap:14px; margin-top:18px}
  .pod{flex:1 1 250px; border:1px solid var(--line); border-radius:12px; padding:14px;
       background:rgba(255,255,255,.03); transition:border-color .2s, transform .2s}
  .pod.new{animation:pop .5s ease}
  @keyframes pop{from{transform:translateY(6px); border-color:var(--indigo)} to{transform:none}}
  .podname{font-size:9px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--indigo)}
  .podrole{color:var(--body); font-size:12px; margin:5px 0 12px}
  .seat{display:grid; grid-template-columns:16px 1fr; gap:10px; padding:10px 0; border-top:1px solid var(--line)}
  .seat:first-of-type{border-top:0}
  .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--faint)}
  .dot.claude{background:var(--coral)} .dot.codex{background:rgba(255,255,255,.85)} .dot.human{background:var(--indigo)}
  .sname{font-size:13.5px; font-weight:600}
  .sattr{color:var(--dim); font-size:11.5px; margin-top:2px}
  .skills{margin-top:6px; display:flex; flex-wrap:wrap; gap:5px}
  .skill{font-size:10px; padding:2px 8px; border:1px solid var(--line2); border-radius:999px; color:var(--body)}
  .empty{color:var(--dim); padding:34px 8px; text-align:center; border:1px dashed var(--line2); border-radius:12px}

  .lbl{font-size:9px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--dim); margin:0 0 10px}
  /* The one place monospace earns its keep: this is a file you will paste. */
  pre{margin:0; padding:14px; background:rgba(0,0,0,.28); border:1px solid var(--line);
      border-radius:10px; font-family:var(--mono); font-size:11.5px; line-height:1.55;
      overflow:auto; max-height:44vh; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--body)}
  .log{margin-top:18px; max-height:26vh; overflow:auto}
  .op{border-left:2px solid var(--line2); padding:5px 0 5px 10px; margin-bottom:8px; font-size:12px; color:var(--dim)}
  .op b{color:var(--fg); font-weight:600}
  .op.newest{border-left-color:var(--indigo)}
  button{font-family:var(--sans); font-size:9px; letter-spacing:.16em; text-transform:uppercase; font-weight:600;
         cursor:pointer; color:var(--fg); background:rgba(255,255,255,.05);
         border:1px solid var(--line2); border-radius:8px; padding:9px 15px}
  button:hover{border-color:rgba(255,255,255,.42)}
  .row{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap}
  .hint{color:var(--faint); font-size:11.5px; margin-top:14px; max-width:70ch}
  code{font-family:var(--mono); font-size:11px; color:var(--indigo)}
</style>

<header>
  <div class="eyebrow">rig designer</div>
  <h1 id="title">an empty floor</h1>
  <div class="sub" id="sub">Tell the agent in your sidebar what the rig should do. It takes shape here.</div>
</header>

<div class="wrap">
  <main>
    <div class="rig" id="rig"></div>
    <div class="row">
      <button id="build">build it</button>
      <button id="copy">copy spec</button>
      <button id="reset">start over</button>
    </div>
    <div class="hint">
      An agent drives this by posting intent to <code>/api/drive</code> — it never touches the markup.
      Try: <code>{"designer":{"action":"add-pod","pod":"dev","role":"writes the code"}}</code>
    </div>
  </main>

  <aside>
    <p class="lbl">rig spec</p>
    <pre id="spec">— nothing yet —</pre>
    <div class="log" id="log"></div>
  </aside>
</div>

<script>
// The whole app: hold a spec, render it as a diagram, and let an AGENT change it
// through the drive channel. There is deliberately no chat client here — the
// studio already spawns seat terminals in the sidebar, and a second way to talk
// to an agent on a box that already has one is not a feature, it is a fork.
const EMPTY = { rig: null, summary: "", pods: [] };
let spec = structuredClone(EMPTY);
let marker = null, fresh = new Set(), primed = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));
const count = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const runtimeOf = (s) => /claude/i.test(s?.runtime || "") ? "claude" : /codex/i.test(s?.runtime || "") ? "codex" : /human|operator/i.test(s?.runtime || "") ? "human" : "";

// A design you lose on refresh makes people distrust the tool. The drive channel
// keeps only the LAST op, so a page loading late sees one op against an empty
// spec rather than a replay — persisting here is what makes a reload survivable
// without asking the runtime to become a store.
const SAVE = "rig-designer.spec";
function persist() { try { localStorage.setItem(SAVE, JSON.stringify(spec)); } catch {} }
function restore() {
  try {
    const raw = localStorage.getItem(SAVE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.pods) && d.pods.length) { spec = { ...structuredClone(EMPTY), ...d }; return true; }
  } catch {}
  return false;
}

function render() {
  persist();
  $("title").textContent = spec.rig || "an empty floor";
  $("sub").textContent = spec.summary || "Tell the agent in your sidebar what the rig should do. It takes shape here.";

  if (!spec.pods.length) {
    $("rig").innerHTML = '<div class="empty">No pods yet.<br>Say what the rig should do — the agent adds them here.</div>';
  } else {
    $("rig").innerHTML = `
      <div class="rigname">${esc(spec.rig || "untitled rig")}</div>
      <div class="rigmeta">${count(spec.pods.length, "pod")} · ${count(spec.pods.reduce((n, p) => n + (p.seats?.length || 0), 0), "seat")}</div>
      <div class="pods">${spec.pods.map(podHTML).join("")}</div>`;
  }
  $("spec").textContent = spec.pods.length ? toYAML(spec) : "— nothing yet —";
}

const podHTML = (p) => `
  <div class="pod${fresh.has("pod:" + p.name) ? " new" : ""}">
    <div class="podname">${esc(p.name)}</div>
    <div class="podrole">${esc(p.role || "—")}</div>
    ${(p.seats || []).map(seatHTML).join("") || '<div class="sattr">no seats yet</div>'}
  </div>`;

const seatHTML = (s) => `
  <div class="seat">
    <div class="dot ${runtimeOf(s)}"></div>
    <div>
      <div class="sname">${esc(s.name)}</div>
      <div class="sattr">${esc([s.runtime, s.model].filter(Boolean).join(" · ") || "runtime unset")}</div>
      ${s.context ? `<div class="sattr">${esc(s.context)}</div>` : ""}
      ${(s.skills || []).length ? `<div class="skills">${s.skills.map((k) => `<span class="skill">${esc(k)}</span>`).join("")}</div>` : ""}
    </div>
  </div>`;

// The spec IS the deliverable — what you would hand to `rig up`. Emitted from the
// same object the diagram draws, so the picture and the file cannot disagree.
function toYAML(sp) {
  const q = (v) => (/^[\w.\/-]+$/.test(v) ? v : JSON.stringify(String(v)));
  const out = [`name: ${q(sp.rig || "untitled")}`];
  if (sp.summary) out.push(`summary: ${q(sp.summary)}`);
  out.push("pods:");
  for (const p of sp.pods) {
    out.push(`  - name: ${q(p.name)}`);
    if (p.role) out.push(`    role: ${q(p.role)}`);
    out.push(`    members:`);
    for (const s of p.seats || []) {
      out.push(`      - name: ${q(s.name)}`);
      if (s.runtime) out.push(`        runtime: ${q(s.runtime)}`);
      if (s.model) out.push(`        model: ${q(s.model)}`);
      if (s.context) out.push(`        startup_context: ${q(s.context)}`);
      if ((s.skills || []).length) out.push(`        skills: [${s.skills.map(q).join(", ")}]`);
    }
  }
  return out.join("\n");
}

// ---- the drive channel: intent in, diagram out ------------------------------
// Ops say WHAT the rig should be, never which element to click. That is the
// contract, and it is why a re-layout here cannot break a driver.
function apply(op) {
  const d = op?.designer;
  if (!d) return null;
  const pod = (n) => spec.pods.find((p) => p.name === n);
  switch (d.action) {
    case "set-rig":
      spec.rig = d.rig ?? spec.rig; spec.summary = d.summary ?? spec.summary;
      return `rig is ${spec.rig}`;
    case "add-pod": {
      if (!d.pod) return null;
      if (!pod(d.pod)) spec.pods.push({ name: d.pod, role: d.role || "", seats: [] });
      else if (d.role) pod(d.pod).role = d.role;
      fresh.add("pod:" + d.pod);
      return `pod <b>${esc(d.pod)}</b>`;
    }
    case "add-seat":
    case "set-seat": {
      if (!d.pod || !d.seat) return null;
      if (!pod(d.pod)) spec.pods.push({ name: d.pod, role: "", seats: [] });
      const p = pod(d.pod);
      let s = p.seats.find((x) => x.name === d.seat);
      if (!s) { s = { name: d.seat }; p.seats.push(s); }
      for (const k of ["runtime", "model", "context"]) if (d[k] != null) s[k] = d[k];
      if (d.skills) s.skills = [].concat(d.skills);
      fresh.add("pod:" + d.pod);
      return `seat <b>${esc(d.seat)}</b> in ${esc(d.pod)}`;
    }
    case "remove":
      if (d.seat) { const p = pod(d.pod); if (p) p.seats = p.seats.filter((x) => x.name !== d.seat); return `removed ${esc(d.seat)}`; }
      if (d.pod) { spec.pods = spec.pods.filter((p) => p.name !== d.pod); return `removed pod ${esc(d.pod)}`; }
      return null;
    case "set-spec":
      if (d.spec && typeof d.spec === "object") { spec = { ...structuredClone(EMPTY), ...d.spec }; return "spec replaced"; }
      return null;
    case "reset":
      spec = structuredClone(EMPTY); fresh.clear(); return "cleared";
    default:
      return null;
  }
}

function note(text) {
  const el = document.createElement("div");
  el.className = "op newest"; el.innerHTML = text;
  const log = $("log");
  log.querySelectorAll(".op").forEach((n) => n.classList.remove("newest"));
  log.prepend(el);
  while (log.children.length > 40) log.lastChild.remove();
}

// Same `?since=` shape as the change signal, so this watches the drive channel
// with the primitive the surface already has rather than inventing a third.
async function poll() {
  try {
    const r = await fetch("/api/drive" + (marker ? "?since=" + encodeURIComponent(marker) : ""));
    const d = await r.json();
    if (d?.ok) {
      // The FIRST poll adopts the marker without applying. The channel holds the
      // last op forever, so a fresh page would replay it as if it had just been
      // sent — which resurrected a design after "start over" and would have made
      // clearing look broken. An op already on the wire when you arrive is
      // history; only what arrives after you are watching is intent.
      if (!primed) { primed = true; marker = d.marker ?? marker; setTimeout(poll, 700); return; }
      if (d.changed && d.op) {
        const what = apply(d.op);
        if (what) { render(); note(what); setTimeout(() => fresh.clear(), 600); }
      }
      marker = d.marker ?? marker;
    }
  } catch { /* a dropped poll is not a state change; the next one recovers */ }
  setTimeout(poll, 700);
}

$("build").onclick = () => {
  if (!spec.pods.length) return note("nothing to build yet");
  note(`<b>build requested</b> — spec is ready for <code>rig up</code>`);
};
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(toYAML(spec)); note("spec copied"); }
  catch { note("clipboard blocked — select the spec and copy"); }
};
$("reset").onclick = () => { apply({ designer: { action: "reset" } }); try { localStorage.removeItem(SAVE); } catch {} render(); note("cleared"); };

// Exposed for tests and for a driver that has a page handle rather than the HTTP
// channel. Same entry point either way, so there is one code path to trust.
window.designer = { apply: (op) => { const w = apply(op); render(); if (w) note(w); return w; }, get spec() { return spec; } };

if (restore()) note("restored the design from this browser");
render();
poll();
</script>
