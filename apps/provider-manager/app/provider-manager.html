<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Providers</title>
  <style>
    /* Same tokens and table idiom as FLOOR on purpose. This is the second
       glanceable table in the studio; a second visual language for the same
       kind of data would make both harder to read. */
    :root {
      color-scheme: dark;
      --bg: #0b0e13;
      --panel: #121722;
      --line: #252c3a;
      --text: #f3f5f8;
      --muted: #929cad;
      --fresh: #47d18c;
      --stale: #ffb44a;
      --unknown: #77808f;
      --hot: #ff795f;
      --info: #6d9eff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at 80% 0%, #172032 0, transparent 34%), var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 28px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .eyebrow { color: var(--fresh); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font: 600 clamp(28px, 5vw, 46px)/1.05 system-ui, sans-serif; letter-spacing: -.04em; }

    .actions { display: flex; align-items: center; gap: 10px; }
    button {
      font: inherit; font-size: 12px; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,.04); border: 1px solid var(--line);
      border-radius: 4px; padding: 8px 14px;
    }
    button:hover:not(:disabled) { border-color: rgba(255,255,255,.4); }
    button:disabled { cursor: default; color: var(--muted); }

    .cost { color: var(--muted); font-size: 11px; max-width: 30ch; text-align: right; }

    .metrics, .table-wrap, .notice { border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 94%, transparent); border-radius: 8px; }
    .metrics { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 20px; overflow: hidden; }
    .metric { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric b { font: 650 17px/1 system-ui, sans-serif; }
    .metric span { color: var(--muted); font-size: 11px; }

    section { margin-top: 24px; }
    h2 { margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; min-width: 780px; border-collapse: collapse; text-align: left; }
    th { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); background: rgba(255,255,255,.018); font-size: 9px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid var(--line); color: #cbd1db; font-size: 11px; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: rgba(255,255,255,.018); }
    .name { color: var(--text); font-weight: 650; white-space: nowrap; }
    .numeric { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .muted { color: var(--muted); }
    /* Editable cells look editable but stay quiet — this is a reference table
       people read far more often than they type into. */
    .edit, select {
      font: inherit; font-size: 11px; color: var(--text);
      background: rgba(255,255,255,.04); border: 1px solid var(--line);
      border-radius: 4px; padding: 4px 7px; max-width: 100%;
    }
    .edit:focus, select:focus { outline: none; border-color: var(--info); }
    .edit.num { width: 62px; text-align: right; }
    select { min-width: 160px; }
    /* An account you can switch to is the answer to the question being asked, so
       it is marked in the row rather than left to be worked out from a number. */
    tr.ready td { background: color-mix(in srgb, var(--fresh) 7%, transparent); }
    /* An account that has just refilled is the answer to "what do I switch to",
       so it is the loudest thing on the page for as long as that is true. */
    tr.just-reset td { background: color-mix(in srgb, var(--fresh) 15%, transparent); box-shadow: inset 2px 0 0 var(--fresh); }
    .pick { white-space: nowrap; }
    .switch { padding: 3px 8px; margin-left: 6px; font-size: 13px; line-height: 1; }
    .switch:hover:not(:disabled) { border-color: var(--fresh); color: var(--fresh); }
    .hint { margin: -4px 0 10px; color: var(--muted); font-size: 11px; }
    .tag.ok { --state: var(--fresh); }

    .tag { --state: var(--unknown); display: inline-flex; align-items: center; gap: 7px; color: var(--state); font-size: 10px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
    .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--state); box-shadow: 0 0 0 3px color-mix(in srgb, var(--state) 12%, transparent); }
    /* Age of the READING, not a verdict on it. Green is recent, amber is hours,
       grey is old — none of them mean the number is wrong, only how far back it
       was taken. A failed refresh is annotated below the box name instead, so a
       stale credential never wears the colour of a usage problem. */
    .s-sampled { --state: var(--fresh); }
    .s-stale { --state: var(--stale); }
    .s-old { --state: var(--unknown); }
    .s-never { --state: var(--unknown); }
    .note { margin-top: 3px; color: var(--stale); font-size: 10px; font-weight: 500; letter-spacing: 0; }

    /* A bar is a nudge toward reading a number that might be absent, so it is
       only ever drawn when there IS a number. */
    .bar { display: block; height: 3px; margin-top: 4px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--fresh); }
    .bar.warn i { background: var(--stale); }
    .bar.hot i { background: var(--hot); }

    .notice { padding: 16px 18px; color: var(--stale); font-size: 12px; line-height: 1.6; }
    .notice b { color: var(--text); }
    .notice code { color: var(--info); }
    footer { margin-top: 22px; color: var(--muted); font-size: 11px; line-height: 1.7; }

    @media (max-width: 640px) {
      main { padding: 18px; }
      header { align-items: start; flex-direction: column; }
      .cost { text-align: left; max-width: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">Accounts</div><h1>Providers</h1></div>
      <div class="actions">
        <p class="cost" id="cost">reading what is already known — costs nothing</p>
        <button id="sample" disabled>Sample now</button>
      </div>
    </header>

    <div id="content"><div class="notice">Reading fleet state…</div></div>

    <footer id="foot"></footer>
  </main>

  <script>
    const content = document.querySelector('#content');
    const sampleBtn = document.querySelector('#sample');
    const costEl = document.querySelector('#cost');
    const foot = document.querySelector('#foot');

    const esc = (v) => String(v ?? '').replace(/[&<>'"]/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[c]);

    // THE RULE THIS WHOLE FILE IS BUILT AROUND: an absent number must never
    // render as a number. A missing utilization header reading as "0%" would
    // say an exhausted account is completely fresh — the exact mistake this app
    // exists to prevent, and the one that would send a box onto a dead account.
    // Absent stays absent, all the way to the screen.
        // Room LEFT is the number the decision is made on. Same absent-never-zero
    // rule as pct: an unknown capacity must not render as a full account, which
    // would invite switching onto something already spent.
    const left = (v) => (v === null || v === undefined)
      ? '<span class="muted">unknown</span>' : `${esc(v)}%`;

        // The recurring slot in the reader's OWN timezone. The server can only say
    // what the timestamp is; only the browser knows where it is being read.
    const slot = (iso) => {
      if (!iso) return '<span class="muted">—</span>';
      const t = new Date(iso);
      if (Number.isNaN(t.getTime())) return '<span class="muted">—</span>';
      return `<span title="${esc(iso)}">${t.toLocaleString(undefined, {
        weekday: 'long', hour: 'numeric', minute: '2-digit'
      })}</span>`;
    };

    const when = (iso) => {
      if (!iso) return '<span class="muted">—</span>';
      const t = new Date(iso);
      if (Number.isNaN(t.getTime())) return '<span class="muted">—</span>';
      return `<span title="${esc(iso)}">${t.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      })}</span>`;
    };

    // THE READING IS THE LAST GOOD ONE, ALWAYS. Its AGE is the qualifier, not a
    // separate kind of state — a cached token expires hourly and only refreshes
    // when a seat uses it, so finding the credential stale is the normal case
    // and rendering it as degradation would make the normal case look broken.
    //
    // What the age must never do is disappear. A number with no age invites
    // someone to act on it as current, so it leads the column rather than
    // hiding in a tooltip.
        // The attempt is SECONDARY and is annotated, not alarmed. A stale credential
    // on the box says nothing about the account's headroom, and showing it with
    // the same weight as a real usage problem is what would argue for rotating
    // away from a healthy account.
        function render(view) {
      const boxes = view.boxes ?? [];
      const accounts = view.accounts ?? [];
      const parts = [];

      // A config problem is shown IN THE UI, not the console. Without a declared
      // fleet this app has nothing to say, and an empty table would read as
      // "no boxes" rather than "you have not told me about any".
      if (view.configError) {
        parts.push(`<div class="notice"><b>No fleet declared.</b> ${esc(view.configError)}<br>
          The fleet is declared, never discovered — scanning for boxes would make this list depend on
          what happened to answer, so a box that was merely asleep would vanish from it.</div>`);
      }

      const ready = accounts.filter(a => a.readyToSwitchTo).length;
      parts.push(`<div class="metrics">
        <div class="metric"><b>${ready}</b><span>ready to switch to</span></div>
        <div class="metric"><b>${boxes.length}</b><span>machine${boxes.length === 1 ? '' : 's'}</span></div>
        <div class="metric"><b>${accounts.length}</b><span>account${accounts.length === 1 ? '' : 's'} seen</span></div>
      </div>`);

      // MACHINES FIRST, because this is the table being read. The question is
      // "what is each machine on, how much has it got, and when does it refill" —
      // so both providers sit side by side on one row and nothing has to be joined
      // in the reader's head.
      const byId = new Map(accounts.map(a => [a.account, a]));
      const opts = (sel) => ['<option value="">— none —</option>'].concat(
        accounts.map(a => `<option value="${esc(a.account)}"${a.account === sel ? ' selected' : ''}>${
          esc(a.label || a.account)}</option>`)
      ).join('');
      const cells = (id) => {
        const a = byId.get(id);
        if (!a) return '<td class="numeric muted">—</td><td class="muted">—</td>';
        return `<td class="numeric">${left(a.capacityLeft)}</td>
                <td>${slot(a.nextResetAt)}</td>`;
      };

      parts.push(`<section><h2>Machines</h2><div class="table-wrap"><table>
        <thead><tr>
          <th>Machine</th>
          <th>Claude account</th><th class="numeric">left</th><th>resets</th>
          <th>Codex account</th><th class="numeric">left</th><th>resets</th>
        </tr></thead><tbody>
        ${boxes.length ? boxes.map(b => `<tr>
          <td class="name">${esc(b.host)}</td>
          <td class="pick"><select data-host="${esc(b.host)}" data-provider="claude">${opts(b.claudeAccount)}</select>
              <button class="switch" data-host="${esc(b.host)}" data-provider="claude" title="switch this machine to the selected account">⇄</button></td>
          ${cells(b.claudeAccount)}
          <td class="pick"><select data-host="${esc(b.host)}" data-provider="codex">${opts(b.codexAccount)}</select>
              <button class="switch" data-host="${esc(b.host)}" data-provider="codex" title="switch this machine to the selected account">⇄</button></td>
          ${cells(b.codexAccount)}
        </tr>`).join('') : `<tr><td colspan="7" class="muted">No machines declared.</td></tr>`}
        </tbody></table></div></section>`);

      // ONE TABLE PER PROVIDER. The two are not comparable: a Claude account has a
      // measurable usage figure and a weekly reset, a Codex account has neither
      // today. Mixing them puts permanent dashes in half the rows and invites the
      // reader to think something is broken.
      //
      // Name and capacity are EDITABLE because neither can always be measured: the
      // credential exposes an opaque id rather than the email on the subscription,
      // and a live percentage needs a live credential, which an idle machine does
      // not have. A real measurement overrides a typed value whenever one happens.
      const accountTable = (title, rows, note) => `<section><h2>${esc(title)}</h2>
        ${note ? `<p class="hint">${note}</p>` : ''}
        <div class="table-wrap"><table>
        <thead><tr>
          <th>Account</th><th class="numeric">Capacity left</th><th>Source</th>
          <th>Resets</th><th>Next reset</th><th>On</th>
        </tr></thead><tbody>
        ${rows.length ? rows.map(a => `<tr class="${a.justReset ? 'just-reset' : a.readyToSwitchTo ? 'ready' : ''}">
          <td class="name"><input class="edit" data-account="${esc(a.account)}" data-field="label"
              value="${esc(a.label && a.label !== a.account ? a.label : '')}"
              placeholder="${esc(a.account)}" title="${esc(a.account)}"
              >${a.justReset ? ' <span class="tag ok">just reset</span>'
                : a.readyToSwitchTo ? ' <span class="tag ok">ready</span>' : ''}</td>
          <td class="numeric"><input class="edit num" type="number" min="0" max="100"
              data-account="${esc(a.account)}" data-field="capacityLeft"
              value="${a.capacityLeft === null || a.capacityLeft === undefined ? '' : esc(a.capacityLeft)}"
              placeholder="—"> %</td>
          <td class="muted">${esc(a.capacitySource === 'none' ? '—' : a.capacitySource || '')}</td>
          <td>${slot(a.nextResetAt)}</td>
          <td>${a.nextResetAt ? when(a.nextResetAt) : '<span class="muted">—</span>'}</td>
          <td>${a.onBox ? esc(a.onBox)
                : a.lastSeenOnHost ? `<span class="muted">last on ${esc(a.lastSeenOnHost)}</span>`
                : '<span class="muted">parked</span>'}</td>
        </tr>`).join('') : `<tr><td colspan="6" class="muted">None seen yet.</td></tr>`}
        </tbody></table></div></section>`;

      parts.push(accountTable('Claude accounts', accounts.filter(a => a.provider !== 'codex')));
      parts.push(accountTable('Codex accounts', accounts.filter(a => a.provider === 'codex'),
        'Usage is not readable for this provider yet, so capacity here is whatever you type.'));

      content.innerHTML = parts.join('');

      // DELEGATED, and deliberately so: this surface rewrites its own content on
      // every refresh, so a handler bound to an element would be detached the
      // first time anything changed and the control would silently stop working.

      // Only quote a price when there is something to buy. "Spends 0 real
      // requests" on an empty fleet is technically true and reads as broken.
      const calls = view.cost?.callsLastPoll ?? 0;
      costEl.textContent = calls
        ? `sampling spends ${calls} real request${calls === 1 ? '' : 's'} — one per box`
        : 'reading what is already known — costs nothing';
      sampleBtn.disabled = !boxes.length;

      foot.innerHTML = `Read at ${esc(view.generatedAt || '')}.
        Usage is read on each box against the token that box already holds — no credential is stored here.`;
    }

    async function load() {
      try {
        const r = await fetch('/api/fleet/state');
        const view = await r.json();
        render(view);
      } catch (e) {
        // A failed load must never wear an empty state's clothes.
        content.innerHTML = `<div class="notice"><b>Could not read fleet state.</b> ${esc(e.message)}<br>
          This is a failure, not an empty fleet.</div>`;
        sampleBtn.disabled = true;
      }
    }

    // EXPLICIT ONLY. Never on a timer: a poll spends real requests against the
    // very budget it reports, and an instrument that quietly consumes what it
    // measures is not an instrument.
    sampleBtn.addEventListener('click', async () => {
      const label = sampleBtn.textContent;
      sampleBtn.disabled = true;
      sampleBtn.textContent = 'Sampling…';
      try {
        const r = await fetch('/api/fleet/sample', { method: 'POST' });
        const view = await r.json();
        if (!view.ok) {
          content.innerHTML = `<div class="notice"><b>Sample refused.</b> ${esc(view.error)}</div>`;
        } else {
          render(view);
        }
      } catch (e) {
        content.innerHTML = `<div class="notice"><b>Sample failed.</b> ${esc(e.message)}</div>`;
      } finally {
        sampleBtn.textContent = label;
        sampleBtn.disabled = false;
      }
    });

    load();
    // Re-reading STATE is free, so this refresh costs nothing. It deliberately
    // never triggers a sample.
    setInterval(load, 30000);
    // A failed write must SAY so. Silently reverting a dropdown would look like
    // the control simply does not work, which is worse than an error.
    let noteTimer = null;
    function note(msg) {
      costEl.textContent = msg;
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => { costEl.textContent = 'reading what is already known — costs nothing'; }, 6000);
    }

    // The switch button. It DISPATCHES the work to an agent — it does not rotate
    // the credential here — and the wording says so, because a control that looked
    // like it had switched something while only writing a note would be worse than
    // no control at all.
    content.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button.switch');
      if (!btn) return;
      const row = btn.closest('td');
      const account = row.querySelector('select')?.value;
      if (!account) { note('pick an account first'); return; }
      btn.disabled = true; btn.textContent = '…';
      try {
        const d = await post('/api/fleet/switch', {
          host: btn.dataset.host, provider: btn.dataset.provider, account,
        });
        note(`asked ${d.dispatchedTo} to switch ${btn.dataset.provider} on ${btn.dataset.host} — not done yet, they will report back`);
        render(d);
      } catch (e) {
        btn.disabled = false; btn.textContent = '⇄';
        note(`could not dispatch: ${e.message}`);
      }
    });

    const post = async (path, body) => {
      const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' },
                                    body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.ok === false) throw new Error(d.error || `HTTP ${r.status}`);
      return d;
    };

    // Which account a machine is on. This RECORDS the assignment — it does not
    // rotate the credential. The surface says so out loud rather than letting a
    // dropdown imply it did something it did not.
    content.addEventListener('change', async (ev) => {
      const sel = ev.target.closest('select[data-host]');
      if (sel) {
        sel.disabled = true;
        try {
          render(await post('/api/fleet/assign', {
            host: sel.dataset.host, provider: sel.dataset.provider, account: sel.value,
          }));
        } catch (e) { sel.disabled = false; note(`could not record that: ${e.message}`); }
        return;
      }
      const inp = ev.target.closest('input.edit[data-account]');
      if (inp) {
        const field = inp.dataset.field;
        try {
          render(await post('/api/fleet/account', {
            account: inp.dataset.account,
            [field]: field === 'capacityLeft' ? (inp.value === '' ? null : Number(inp.value)) : inp.value,
          }));
        } catch (e) { note(`could not save that: ${e.message}`); }
      }
    });
  </script>
</body>
</html>
