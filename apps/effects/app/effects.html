<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Effects</title>
  <style>
    /* Same tokens as FLOOR and PROVIDERS. A third visual language for a third
       surface would make all three harder to read. */
    :root {
      color-scheme: dark;
      --bg: #0b0e13; --panel: #121722; --line: #252c3a;
      --text: #f3f5f8; --muted: #929cad; --fresh: #47d18c; --info: #6d9eff; --hot: #ff795f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .wrap { display: grid; grid-template-columns: 1fr 300px; gap: 16px; padding: 16px; height: 100vh; }
    @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; height: auto; } }

    .stage {
      display: flex; align-items: center; justify-content: center; min-height: 240px;
      border: 1px solid var(--line); border-radius: 8px; background: #06080c; overflow: hidden;
    }
    canvas { max-width: 100%; max-height: 100%; display: block; }
    /* An explicit display wins over the `hidden` attribute, which the UA stylesheet
       implements as display:none. Without this the two renderers draw side by side
       and it reads as one effect producing a split image. */
    canvas[hidden], video[hidden] { display: none; }

    .panel { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px; }
    h1 { margin: 0; font: 600 20px/1 system-ui, sans-serif; letter-spacing: -.03em; }
    .eyebrow { color: var(--fresh); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    h2 { margin: 0 0 9px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }

    .row { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; margin-bottom: 7px; }
    .row label { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row label[title] { cursor: help; }
    input[type=range] { width: 100%; accent-color: var(--fresh); }
    input[type=number], select, input[type=color] {
      width: 100%; font: inherit; font-size: 11px; color: var(--text);
      background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px;
    }
    input[type=color] { padding: 1px; height: 24px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    button {
      font: inherit; font-size: 11px; cursor: pointer; color: var(--text);
      background: rgba(255,255,255,.04); border: 1px solid var(--line);
      border-radius: 4px; padding: 5px 9px;
    }
    button:hover { border-color: var(--fresh); color: var(--fresh); }
    button.ghost { color: var(--muted); }
    .note { color: var(--muted); font-size: 10px; line-height: 1.5; margin-top: 8px; }
    .err { color: var(--hot); font-size: 11px; line-height: 1.5; }
    .srcrow { display: flex; gap: 6px; align-items: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <canvas id="gl"></canvas>
      <canvas id="c2d" hidden></canvas>
      <video id="vid" hidden playsinline muted loop></video>
    </div>
    <div class="panel">
      <div class="card">
        <div class="eyebrow" id="eyebrow">Effects</div><h1>Effects</h1>
        <select id="family" style="margin-top:8px"></select>
        <p class="note" id="summary"></p>
      </div>

      <div class="card">
        <h2>Source</h2>
        <div class="srcrow">
          <select id="source"><option value="">built-in test frame</option></select>
          <button class="ghost" id="reload" title="reload the source list">↻</button>
        </div>
        <p class="note" id="srcnote"></p>
        <div id="vidctl" hidden style="margin-top:8px"><button id="play">play</button>
          <span class="note" id="vidnote"></span></div>
      </div>

      <div class="card">
        <h2>Looks</h2>
        <div class="presets" id="presets"></div>
        <div class="presets" style="margin-top:10px">
          <button class="ghost" id="saveframe" title="save what is on screen right now">save frame</button>
          <button class="ghost" id="sheet" title="every look on this source, side by side">look sheet</button>
        </div>
      </div>

      <div class="card">
        <h2>Parameters</h2>
        <div id="params"></div>
        <button class="ghost" id="reset" style="margin-top:8px">reset to defaults</button>
      </div>

      <div class="card"><p class="note" id="status">starting…</p><p class="err" id="error"></p></div>
    </div>
  </div>

  <script type="module">
    const $ = (s) => document.querySelector(s);
    const canvas = $('#gl'), statusEl = $('#status'), errEl = $('#error');
    const say = (m) => { statusEl.textContent = m; };
    const fail = (m) => { errEl.textContent = m; };

    const gl = canvas.getContext('webgl2', { alpha: false, preserveDrawingBuffer: true });
    if (!gl) fail('WebGL2 is not available in this browser, so nothing can render here.');

    let ALL = null, FAMILY = null, familyId = 'scan';
    let PROGRAM = null, params = {}, srcTex = null, pathTex = null;
    let srcW = 0, srcH = 0;
    let TILE = null, ANALOG = null, CURVES = null, atlas = [], atlasFor = '';
    // A parameter as a function of time. Null until something sets one, so the
    // app is a still-image tool by default and a motion-graphics one on request.
    let curveSpec = null, lastCurve = null;
    let srcEl = null, isVideo = false, videoLoop = null;
    const c2d = $('#c2d'), vid = $('#vid');

    // TESTABILITY HANDLES. An automated check — or an agent driving this from the
    // sidebar — should read state from here rather than scraping the DOM or
    // guessing from pixels. Exposed deliberately, not as a debug leftover.
    window.effects = {
      get params() { return { ...params }; },
      get ready() { return Boolean(PROGRAM && srcTex); },
      set: (patch) => { paramGen++; Object.assign(params, patch); syncInputs(); draw(); return { ...params }; },
      preset: (name) => applyPreset(name),
      families: () => ALL,
      family: (id) => { if (id) { familyId = id; $('#family').value = id; return useFamily(); } return familyId; },
      stats: () => lastStats,
      windows: () => lastWindows,
      // Set, clear (null) or read the curve. A curve is DATA: an agent can author
      // one, a timeline can store one, a beat track can generate one.
      curves: (spec) => { curveSpec = spec ?? null; lastCurve = null; draw(); return curveSpec; },
      curveInfo: () => lastCurve,
      renderSize: () => ({ width: canvas.width, height: canvas.height, sourceWidth: srcW, sourceHeight: srcH }),
      frameHash: () => frameHash(),
      // Export handles. An agent driving this should be able to LOOK at what it
      // made, not only read back the numbers it set.
      frame: () => frameDataUrl(),
      contactSheet: (opts) => contactSheet(opts || {}),
    };

    async function boot() {
      try {
        ALL = (await (await fetch('/api/effects/families')).json()).families;
        TILE = await import('/api/effects/engine/tile.mjs');
        // Imported, not copied. The sampling geometry has to be identical here and
        // in any headless render, and the only way to guarantee that is one file.
        ANALOG = await import('/api/effects/engine/analog.mjs');
        CURVES = await import('/api/effects/engine/curves.mjs');
        const sel = $('#family');
        sel.innerHTML = '';
        for (const [id, f] of Object.entries(ALL)) {
          const o = document.createElement('option'); o.value = id; o.textContent = f.name; sel.appendChild(o);
        }
        sel.value = familyId;
        sel.addEventListener('change', async () => { familyId = sel.value; await useFamily(); });
        await useFamily();
        await loadSources();
        await useSource('');
        say('ready');
      } catch (e) { fail(`could not start: ${e.message}`); }
    }

    // Switching family swaps BOTH the control set and the renderer. The two
    // families do not share a rendering approach on purpose: scan is a per-pixel
    // gather that belongs on the GPU, tile is a few hundred independent block draws
    // that does not. Forcing one path on both would cost performance in one
    // direction and complexity in the other.
    const programs = {};
    async function useFamily() {
      FAMILY = ALL[familyId];
      if (FAMILY.engine === 'webgl2') {
        // Each GPU family has its own shader, fetched from the provider rather than
        // carried here. Cached per family so switching back and forth does not
        // recompile.
        if (!programs[familyId]) {
          const sh = await (await fetch(`/api/effects/shader?family=${familyId}`)).json();
          if (!sh.ok) { fail(sh.error || 'no shader'); return; }
          programs[familyId] = build(sh.vertex, sh.fragment);
        }
        PROGRAM = programs[familyId];
      }
      $('#eyebrow').textContent = FAMILY.name;
      $('#summary').textContent = FAMILY.summary;
      const gpu = FAMILY.engine === 'webgl2';
      canvas.hidden = !gpu; c2d.hidden = gpu;
      // Families do not agree on render size — analog caps its internal width —
      // so a switch has to re-upload rather than inherit the previous family's
      // canvas dimensions.
      if (srcEl && gpu) upload(srcEl, srcW, srcH);
      buildControls();
      applyDefaults();
      atlasFor = '';
      draw();
    }

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        // A shader that fails to compile must SAY so. A blank canvas and a clean
        // console is the failure that wastes the most time.
        throw new Error(`shader did not compile: ${gl.getShaderInfoLog(s)}`);
      }
      return s;
    }
    function build(vs, fs) {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`link failed: ${gl.getProgramInfoLog(p)}`);
      return p;
    }

    function buildControls() {
      const host = $('#params'); host.innerHTML = '';
      for (const [key, spec] of Object.entries(FAMILY.params)) {
        const row = document.createElement('div'); row.className = 'row';
        const lab = document.createElement('label');
        lab.textContent = key; lab.title = spec.says || key;
        row.appendChild(lab);
        let input;
        if (spec.type === 'bool') { input = document.createElement('input'); input.type = 'checkbox'; }
        else if (spec.type === 'enum') {
          input = document.createElement('select');
          for (const v of spec.values) { const o = document.createElement('option'); o.value = o.textContent = v; input.appendChild(o); }
        }
        else if (spec.type === 'color') { input = document.createElement('input'); input.type = 'color'; }
        else {
          input = document.createElement('input'); input.type = 'range';
          input.min = spec.min; input.max = spec.max;
          input.step = spec.type === 'int' ? 1 : (spec.max - spec.min) / 200;
          row.style.gridTemplateColumns = '1fr';
          const wrap = document.createElement('div'); wrap.appendChild(lab.cloneNode(true));
          row.innerHTML = ''; row.appendChild(lab);
        }
        input.dataset.key = key;
        input.addEventListener('input', () => {
          paramGen++;
          params[key] = spec.type === 'bool' ? input.checked
                      : (spec.type === 'enum' || spec.type === 'color') ? input.value
                      : Number(input.value);
          draw();
        });
        row.appendChild(input);
        host.appendChild(row);
      }
      const box = $('#presets'); box.innerHTML = '';
      for (const name of Object.keys(FAMILY.presets)) {
        const b = document.createElement('button');
        b.textContent = name; b.dataset.preset = name;
        b.addEventListener('click', () => applyPreset(name));
        box.appendChild(b);
      }
    }

    function applyDefaults() {
      paramGen++;
      params = {};
      for (const [k, s] of Object.entries(FAMILY.params)) params[k] = s.default;
      syncInputs(); draw();
    }
    // GENERATION COUNTER, and it is not defensive programming — it fixes a real
    // defect an independent QA drive reproduced: preset() is asynchronous because the PROVIDER
    // resolves it, so a set() issued while that request was in flight was applied,
    // returned to the caller as applied, and then silently overwritten when the
    // preset's response landed. The control appeared to do nothing, and a LATER
    // control appeared to work, which is the most confusing possible symptom.
    //
    // This is the natural way an agent drives the app — apply a look, then adjust
    // one knob — so the race is not an edge case, it is the main path.
    let paramGen = 0;
    async function applyPreset(name) {
      const gen = ++paramGen;
      // Resolved by the PROVIDER, not here — so a preset means the same thing to
      // the surface, to an agent, and to a headless render.
      const r = await (await fetch('/api/effects/resolve', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ family: familyId, preset: name }),
      })).json();
      if (!r.ok) { fail(r.error || 'preset failed'); return; }
      if (gen !== paramGen) {
        // Something changed the parameters while this was in flight. The newer
        // intent wins, and we say so rather than pretending the preset landed.
        say(`look: ${name} (superseded by a later change)`);
        return { ...params };
      }
      params = r.params; syncInputs(); draw(); say(`look: ${name}`);
      return r.params;
    }
    function syncInputs() {
      for (const el of $('#params').querySelectorAll('[data-key]')) {
        const k = el.dataset.key, spec = FAMILY.params[k];
        if (spec.type === 'bool') el.checked = Boolean(params[k]); else el.value = params[k];
      }
    }

    // THE AUTHORED VALUES AND THE LIVE ONES ARE DIFFERENT THINGS, and keeping
    // them apart is what lets a curve animate a knob without destroying what the
    // user or the agent actually set. The sliders keep showing the authored value;
    // the renderer reads the curved one.
    function effective() {
      if (!CURVES || !curveSpec || !FAMILY) return params;
      const dur = isVideo && Number.isFinite(vid.duration) ? vid.duration : 0;
      const at = isVideo ? vid.currentTime : 0;
      const r = CURVES.evalCurves(curveSpec, FAMILY, at, dur);
      lastCurve = { t: r.t, driving: Object.keys(r.patch), notes: r.notes };
      return { ...params, ...r.patch };
    }

    // A procedural frame so the app WORKS before any media is bound. It is built
    // to show the effect honestly: hard edges reveal displacement, fine stripes
    // reveal channel skew, flat fields reveal grain.
    function testFrame() {
      const c = document.createElement('canvas'); c.width = 900; c.height = 600;
      const x = c.getContext('2d');
      const g = x.createLinearGradient(0, 0, 900, 600);
      g.addColorStop(0, '#1b2740'); g.addColorStop(1, '#4a2140');
      x.fillStyle = g; x.fillRect(0, 0, 900, 600);
      for (let i = 0; i < 900; i += 12) { x.fillStyle = i % 24 ? '#e8ecf5' : '#0d1018'; x.fillRect(i, 40, 6, 90); }
      x.fillStyle = '#47d18c'; x.fillRect(90, 210, 300, 180);
      x.fillStyle = '#ff795f'; x.beginPath(); x.arc(600, 300, 110, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#6d9eff'; x.beginPath(); x.moveTo(430, 520); x.lineTo(560, 430); x.lineTo(690, 520); x.closePath(); x.fill();
      x.fillStyle = '#f3f5f8'; x.font = '700 56px ui-monospace, monospace'; x.fillText('SCAN', 90, 150);
      return c;
    }

    // ANALOG RENDERS AT A REDUCED INTERNAL WIDTH, and this is a CORRECTNESS
    // requirement before it is a performance one — the width, the tap reach and
    // the window formula all come from the engine module so there is exactly one
    // definition of the sampling geometry. See analog.mjs for why.
    function upload(img, w, h) {
      srcW = w; srcH = h;
      const scale = (familyId === 'analog' && ANALOG)
        ? Math.min(1, ANALOG.ANALOG_INTERNAL_WIDTH / w) : 1;
      canvas.width = Math.max(2, Math.round(w * scale));
      canvas.height = Math.max(2, Math.round(h * scale));
      if (!srcTex) srcTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, srcTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      draw();
    }

    async function loadSources() {
      try {
        const r = await (await fetch('/api/effects/sources')).json();
        const sel = $('#source');
        sel.innerHTML = '<option value="">built-in test frame</option>';
        for (const s of r.sources || []) { const o = document.createElement('option'); o.value = o.textContent = s; sel.appendChild(o); }
        $('#srcnote').textContent = r.note ? r.note
          : `${(r.sources || []).length} image${(r.sources || []).length === 1 ? '' : 's'} in the bound media root`;
      } catch (e) { $('#srcnote').textContent = `could not list sources: ${e.message}`; }
    }
    async function useSource(rel) {
      stopVideo();
      levelsEma = null;
      if (!rel) {
        const c = testFrame(); srcEl = c; isVideo = false;
        $('#vidctl').hidden = true; upload(c, c.width, c.height); return;
      }
      if (/\.(mp4|mov|webm|m4v)$/i.test(rel)) return useVideo(rel);
      $('#vidctl').hidden = true; isVideo = false;
      await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => { srcEl = im; upload(im, im.naturalWidth, im.naturalHeight); res(); };
        im.onerror = () => rej(new Error(`could not load ${rel}`));
        im.src = `/media/${encodeURIComponent(rel)}`;
      }).catch((e) => fail(e.message));
    }

    // VIDEO. The whole point of the exercise is making ordinary recent footage look
    // old, which is not testable on stills — so a video is just another texture
    // source, re-uploaded per frame.
    function stopVideo() {
      if (videoLoop) { cancelAnimationFrame(videoLoop); videoLoop = null; }
      if (!vid.paused) vid.pause();
    }
    async function useVideo(rel) {
      isVideo = true; srcEl = vid;
      $('#vidctl').hidden = false;
      vid.src = `/media/${encodeURIComponent(rel)}`;
      await new Promise((res, rej) => {
        vid.onloadeddata = () => res();
        vid.onerror = () => rej(new Error(`could not load ${rel} — the browser may not decode this codec`));
      }).catch((e) => { fail(e.message); throw e; });
      upload(vid, vid.videoWidth, vid.videoHeight);
      $('#vidnote').textContent = `${vid.videoWidth}x${vid.videoHeight}, ${vid.duration.toFixed(1)}s`;
      say('video loaded — press play');
    }
    function videoTick() {
      if (!isVideo || vid.paused) return;
      // Re-upload the current frame, then draw. The frame clock is the VIDEO's,
      // not the render loop's, so playback speed does not depend on refresh rate.
      if (FAMILY.engine === 'webgl2') { frameCounter++; upload(vid, vid.videoWidth, vid.videoHeight); }
      else { draw(); }
      videoLoop = requestAnimationFrame(videoTick);
    }
    $('#play').addEventListener('click', () => {
      if (!isVideo) return;
      if (vid.paused) { vid.play(); $('#play').textContent = 'pause'; videoTick(); }
      else { vid.pause(); $('#play').textContent = 'play'; stopVideo(); }
    });

    // The path is built in the PROVIDER so the preview and any headless render
    // agree exactly. Rebuilt only when a parameter changes — never per frame.
    // THE COMMENT ABOVE WAS ASPIRATIONAL AND THE CODE WAS NOT. `draw()` awaited
    // this on EVERY frame, so playing a video did one provider round-trip per
    // frame for a path that only depends on the parameters. Measured on a playing
    // clip: 0.5 distinct rendered frames per second while the animation loop was
    // running at 16 — the picture was effectively frozen and nothing errored.
    //
    // The path is keyed on exactly the inputs buildPath() reads, so a parameter
    // change still rebuilds it and a new frame does not.
    let pathPending = null, pathKey = '';
    const pathInputs = (P) => JSON.stringify([
      P.scanAxis === 'horizontal' ? srcW : srcH, P.scanAxis,
      P.wobbleAmount, P.wobbleFrequency, P.wobblePhase,
      P.jitterAmount, P.jitterScale, P.tearAmount, P.tearFrequency,
      P.drift, P.rotationDrift, P.scaleDrift, P.seed,
    ]);
    // Takes the LIVE values, so a curve on a path knob animates the warp. When one
    // is curved the key changes every frame and the path rebuilds every frame,
    // which is correct rather than wasteful — the path IS the thing being animated.
    async function refreshPath(P) {
      const key = pathInputs(P);
      if (key === pathKey && pathTex) return;
      const len = Math.max(2, P.scanAxis === 'horizontal' ? srcW : srcH);
      const r = await (await fetch('/api/effects/path', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ length: Math.min(4096, len), params: P }),
      })).json();
      if (!r.ok) throw new Error(r.error || 'path failed');
      const data = new Uint8Array(r.path);
      if (!pathTex) pathTex = gl.createTexture();
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.bindTexture(gl.TEXTURE_2D, pathTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      // NEAREST, and for two independent reasons.
      //
      // CORRECTNESS: this is a displacement lookup, one texel per scan row. Linear
      // filtering blends adjacent rows, which rounds off exactly the hard cliffs a
      // tear is supposed to produce — the interpolation fights the effect.
      //
      // PORTABILITY, and this one was measured the hard way: a float texture with
      // LINEAR filtering sampled as ZERO on this renderer while reading back
      // correctly through a framebuffer. OES_texture_float_linear reported as
      // supported. The displacement silently vanished and the image looked merely
      // "subtle" rather than broken, which is the worst way for a shader to fail.
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, r.length, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
      pathKey = key;
    }

    let frameCounter = 0;
    // THE RENDER FENCE. `paramGen` is the INTENT counter; this is the DELIVERY
    // one — the intent generation that a completed render actually drew. Anything
    // that needs to capture the screen must wait for this to catch up rather than
    // guess at a duration.
    //
    // A sleep cannot do this job. Independent QA delayed the animation callbacks
    // and got a full, correctly-labelled contact sheet in which five of seven
    // cells held a DIFFERENT look, with no error and a success message. A longer
    // timeout only moves the threshold; it does not remove the defect.
    let lastDrawnGen = -1;

    // DRAWS ARE SERIALISED, AND THE OLD FLAG DID NOT DO THAT. It was cleared at
    // the START of the animation callback, before an async body that awaits the
    // displacement path — so a second draw could begin while the first was still
    // in flight, and two render bodies interleaved over one GL context. One
    // uploaded a path texture while the other set uniforms and drew, producing a
    // frame belonging to NEITHER intent.
    //
    // That is what independent QA saw: a sheet cell that matched neither the pure
    // preset nor the curved variant — a third image — while the authored params
    // and the provider request at capture time were both correct. Right inputs,
    // wrong pixels, because the pixels came from two renders mixed together.
    //
    // A request arriving mid-render is REMEMBERED rather than dropped, so the
    // newest intent always gets drawn eventually.
    let drawing = false, drawPending = false;
    function draw() {
      if (drawing) { drawPending = true; return; }
      runDraw();
    }
    async function runDraw() {
      drawing = true;
      const finish = (gen) => {
        // ONLY CLAIM DELIVERY IF THIS RENDER IS STILL THE NEWEST INTENT. A render
        // superseded while it was awaiting must not satisfy the fence — that is
        // how a stale frame gets captured with a current label.
        if (gen === paramGen) lastDrawnGen = gen;
        drawing = false;
        if (drawPending) { drawPending = false; draw(); }
      };
      await new Promise((r) => requestAnimationFrame(r));
      // Captured AFTER the frame boundary, so it reflects the state actually
      // being rendered rather than the state when the request was made.
      const gen = paramGen;
      if (FAMILY && FAMILY.engine === 'canvas2d') {
        try { drawTiles(); errEl.textContent = ''; } catch (e) { fail(e.message); }
        return finish(gen);
      }
      if (!PROGRAM || !srcTex) { drawing = false; if (drawPending) { drawPending = false; draw(); } return; }
      {
        try {
          const P = effective();
          if (!gl.getExtension('EXT_color_buffer_float')) { /* path texture only; sampling is fine */ }
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.useProgram(PROGRAM);
          const u = (n) => gl.getUniformLocation(PROGRAM, n);
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex); gl.uniform1i(u('uSrc'), 0);

          if (familyId === 'analog') {
            gl.uniform2f(u('uRes'), canvas.width, canvas.height);
            gl.uniform1f(u('uCycles'), P.subcarrierCycles);
            gl.uniform1f(u('uPhaseAlt'), P.phaseAlternation ? 1 : 0);
            gl.uniform1f(u('uPhaseJitter'), P.phaseJitter);
            gl.uniform1f(u('uHueError'), (P.hueError * Math.PI) / 180);
            // THE FRAME INDEX COMES FROM THE VIDEO CLOCK, never from the render
            // loop. Driven by rAF the crawl speed would change with the monitor's
            // refresh rate — correct on 60Hz, visibly wrong on 120Hz — and that is
            // the bug most implementations of this ship with.
            gl.uniform1i(u('uFrame'), isVideo && vid.duration
              ? Math.floor(vid.currentTime * 59.94) : frameCounter);
            gl.uniform1f(u('uCombMix'), P.combMix);
            // A luma window one carrier period wide is a perfect null; detuning it
            // is precisely what leaks residual carrier into brightness, which IS
            // dot crawl. So the knob is physical rather than a fudge.
            // Computed by the engine, never here — the shader walks the same
            // reach and a disagreement tints the picture instead of erroring.
            const win = ANALOG.analogWindows(P, canvas.width);
            gl.uniform1f(u('uLumaTaps'), win.lumaTaps);
            gl.uniform1f(u('uChromaTaps'), win.chromaTaps);
            lastWindows = win;
            gl.uniform1f(u('uChromaQRatio'), P.chromaQRatio);
            gl.uniform1f(u('uSharpen'), P.sharpen);
            gl.uniform1f(u('uSmear'), P.smear);
            gl.uniform1f(u('uNoise'), P.noise);
            gl.uniform1f(u('uChromaNoise'), P.chromaNoise);
            gl.uniform2f(u('uChromaDelay'), P.chromaDelayX, P.chromaDelayY);
            gl.uniform1f(u('uVertBlend'), P.chromaVertBlend);
            gl.uniform1f(u('uScanlines'), P.scanlines);
            gl.drawArrays(gl.TRIANGLES, 0, 3);
            errEl.textContent = '';
            return finish(gen);
          }

          await refreshPath(P);
          gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, pathTex); gl.uniform1i(u('uPath'), 1);
          gl.uniform2f(u('uRes'), canvas.width, canvas.height);
          gl.uniform2f(u('uAxis'), P.scanAxis === 'horizontal' ? 1 : 0, P.scanAxis === 'horizontal' ? 0 : 1);
          gl.uniform1f(u('uAmp'), 1);
          gl.uniform1f(u('uChroma'), P.chromaShift);
          gl.uniform1f(u('uGrain'), P.grain);
          gl.uniform1f(u('uGrainScale'), P.grainScale);
          const c = P.paperColor || '#ffffff';
          gl.uniform3f(u('uPaper'), parseInt(c.slice(1, 3), 16) / 255, parseInt(c.slice(3, 5), 16) / 255, parseInt(c.slice(5, 7), 16) / 255);
          gl.uniform1f(u('uMono'), P.mono ? 1 : 0);
          gl.uniform1f(u('uSubpixel'), P.subpixel ? 1 : 0);
          gl.uniform1f(u('uSeed'), P.seed);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          errEl.textContent = '';
        } catch (e) { fail(e.message); }
        return finish(gen);
      }
    }


    // ---- TILE FAMILY ------------------------------------------------------
    // The atlas is built ONCE per (tileSet, palette) and its lightness MEASURED
    // rather than assumed. Measuring is the whole point: a family whose shapes
    // happen to cluster dark still produces an honest ramp, where ranking by
    // generation order would leave the picture washed at both ends.
    function drawTileSpec(ctx, spec, size, pal) {
      const pick = (t) => pal[Math.max(0, Math.min(pal.length - 1, Math.round(t * (pal.length - 1))))];
      ctx.clearRect(0, 0, size, size);
      switch (spec.kind) {
        case 'solid':
          ctx.fillStyle = pick(spec.t); ctx.fillRect(0, 0, size, size); break;
        case 'bayer': {
          // A threshold matrix IS a tile. This is the case that makes "a
          // brightness-ranked tile set is a generalised ordered dither" concrete.
          const n = spec.matrix, cell = size / n;
          const M = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
          ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = pal[pal.length - 1];
          for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
            if (spec.t * 16 > M[y % 4][x % 4]) ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
          break;
        }
        case 'dot':
          ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = pal[pal.length - 1];
          ctx.beginPath(); ctx.arc(size / 2, size / 2, (size / 2) * spec.radius, 0, Math.PI * 2); ctx.fill();
          break;
        case 'glyph':
          ctx.fillStyle = pal[0]; ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = pal[pal.length - 1];
          ctx.font = `${Math.floor(size * 0.9)}px ui-monospace, monospace`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(spec.char, size / 2, size / 2);
          break;
        case 'shapes': {
          ctx.fillStyle = pick(spec.t * 0.4); ctx.fillRect(0, 0, size, size);
          ctx.fillStyle = pick(0.55 + spec.t * 0.45);
          ctx.save(); ctx.translate(size / 2, size / 2); ctx.rotate((spec.rotation * Math.PI) / 180);
          ctx.translate(-size / 2, -size / 2);
          const k = size * (0.25 + spec.t * 0.7);
          switch (spec.shape) {
            case 0: ctx.fillRect(0, 0, size, k); break;
            case 1: ctx.beginPath(); ctx.arc(size/2, size/2, k/2, 0, Math.PI*2); ctx.fill(); break;
            case 2: ctx.beginPath(); ctx.moveTo(0,size); ctx.lineTo(size/2,size-k); ctx.lineTo(size,size); ctx.fill(); break;
            case 3: ctx.fillRect((size-k)/2, 0, k, size); break;
            case 4: ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(size,0); ctx.lineTo(0,k); ctx.fill(); break;
            case 5: ctx.beginPath(); ctx.arc(0, size, k, -Math.PI/2, 0); ctx.fill(); break;
            case 6: for (let i=0;i<4;i++) if ((i+spec.shape)%2) ctx.fillRect((i%2)*size/2,(i>1?1:0)*size/2,size/2,size/2); break;
            default: ctx.fillRect(0, size - k, size, k);
          }
          ctx.restore(); break;
        }
      }
    }

    // TAKES THE LIVE VALUES, and the cache key is the reason this is a fix rather
    // than a tidy-up. Keyed on the AUTHORED tileSet and palette, a curve driving
    // either one updated the effective values, hit the unchanged key, and returned
    // early — so the atlas was never rebuilt and the frame stayed pixel-identical
    // while curveInfo() reported the parameter as driving with no notes. Found by
    // independent QA in the family I had said I had not audited: the THIRD site
    // with this shape, after the window computation and the scan path.
    function buildAtlas(P) {
      const key = `${P.tileSet}|${P.palette}`;
      if (atlasFor === key) return;
      const fam = TILE.TILE_FAMILIES[P.tileSet];
      const pal = TILE.PALETTES[P.palette] || TILE.PALETTES.paper;
      const size = 32;
      atlas = [];
      for (let i = 0; i < fam.count; i++) {
        const spec = TILE.tileSpec(P.tileSet, i, fam.count);
        const c = document.createElement('canvas'); c.width = c.height = size;
        const x = c.getContext('2d', { willReadFrequently: true });
        drawTileSpec(x, spec, size, pal);
        // MEASURED, in linear light, by the same function the engine uses.
        atlas.push({ img: c, l: TILE.tileLightness(x.getImageData(0, 0, size, size)) });
      }
      atlasFor = key;
    }

    function drawTiles() {
      if (!srcEl) return;
      const P = effective();
      buildAtlas(P);
      const W = srcW, H = srcH;
      c2d.width = W; c2d.height = H;
      const ctx = c2d.getContext('2d', { willReadFrequently: true });

      const cols = Math.max(2, P.gridSize);
      const rows = Math.max(2, Math.round((cols * H) / W));
      const small = document.createElement('canvas'); small.width = cols; small.height = rows;
      const sx = small.getContext('2d', { willReadFrequently: true });
      sx.imageSmoothingEnabled = true;
      sx.drawImage(srcEl, 0, 0, cols, rows);
      let grid = TILE.luminanceGrid(sx.getImageData(0, 0, cols, rows), cols, rows);

      // NORMALISE BEFORE QUANTISING. Measured per frame, then smoothed across
      // frames — an unsmoothed window recomputed every frame makes the whole
      // image pump as the shot changes, which is the classic auto-exposure
      // artifact and reads as a bug rather than as a look.
      const win = TILE.levelWindow(grid);
      if (levelsEma && isVideo && !win.degenerate) {
        // A CUT IS NOT MOTION, AND SMOOTHING THROUGH ONE IS THE ARTIFACT.
        // Independent QA measured the old unconditional ease taking 1.3-1.5
        // seconds to settle across a hard cut between two STATIC shots, with the
        // first frames visibly brighter and detail resolving progressively — the
        // classic auto-exposure pump, which reads as a bug rather than a look.
        //
        // Frame-to-frame the window barely moves; across a cut it jumps. So a
        // jump is the signal: ease the small changes, SNAP the large ones. The
        // threshold is in L* units, where the whole scale is 0-100.
        const jump = Math.max(Math.abs(win.lo - levelsEma.lo), Math.abs(win.hi - levelsEma.hi));
        if (jump < SCENE_CUT_LSTAR) {
          const a = 0.12;
          win.lo = levelsEma.lo + (win.lo - levelsEma.lo) * a;
          win.hi = levelsEma.hi + (win.hi - levelsEma.hi) * a;
          win.span = win.hi - win.lo;
          win.degenerate = win.span < 4;
        }
        if (jump >= SCENE_CUT_LSTAR) cutCount++;
      }
      levelsEma = win.degenerate ? null : { lo: win.lo, hi: win.hi };
      grid = TILE.applyLevels(grid, win, P.autoLevels);

      if (P.contrast !== 1) {
        for (let i = 0; i < grid.length; i++) grid[i] = Math.max(0, Math.min(100, (grid[i] - 50) * P.contrast + 50));
      }

      const blocks = P.adaptiveMerge
        ? TILE.planBlocks(grid, cols, rows, { tolerance: P.mergeTolerance, minCells: P.minBlockCells })
        : Array.from({ length: cols * rows }, (_, i) => ({ x: i % cols, y: Math.floor(i / cols), w: 1, h: 1, l: grid[i] }));

      const bw = W / cols, bh = H / rows;
      ctx.fillStyle = (TILE.PALETTES[P.palette] || TILE.PALETTES.paper)[0];
      ctx.fillRect(0, 0, W, H);
      for (const b of blocks) {
        const t = TILE.pickTile(atlas, b.l, {
          toneLevels: P.toneLevels, variety: P.tileVariety, x: b.x, y: b.y, seed: P.seed,
        });
        if (t) ctx.drawImage(t.img, b.x * bw, b.y * bh, b.w * bw, b.h * bh);
        if (P.outline) { ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1;
          ctx.strokeRect(b.x * bw, b.y * bh, b.w * bw, b.h * bh); }
      }
      // An agent asking for "chunkier" needs to know whether it worked. The
      // originals give no such feedback, so an agent drives them blind.
      lastStats = { blocks: blocks.length, cells: cols * rows,
                    meanBlockCells: +(blocks.reduce((a, b) => a + b.w * b.h, 0) / blocks.length).toFixed(2),
                    // What the tone mapping actually did. A driver asking "why is
                    // this all one tile" needs to see the source's own range, not
                    // guess at it — and a degenerate window is a real answer.
                    levels: { lo: +win.lo.toFixed(1), hi: +win.hi.toFixed(1),
                              span: +win.span.toFixed(1), flatSourceLeftAlone: win.degenerate,
                              // How many times the mapping has SNAPPED rather than
                              // eased. Rises once per cut; compare across two
                              // samples to see whether one happened between them.
                              cuts: cutCount } };
    }
    // Reset whenever the source changes: carrying one clip's tone window into
    // another's first frame is a visible flash.
    // Above this jump in the measured window, the source has CUT rather than
    // moved, and the tone mapping follows immediately instead of easing.
    const SCENE_CUT_LSTAR = 12;
    // A COUNTER, NOT A FLAG. The first shape of this was a per-frame boolean, and
    // it was effectively unobservable — by the time anything reads it the renderer
    // has drawn several more frames and reset it, so a checker sampling after a
    // cut sees false and concludes nothing happened. A count survives sampling.
    let levelsEma = null, cutCount = 0;
    let lastStats = null;
    // The sampling geometry actually sent to the GPU. Exposed for the same reason
    // stats() is: a checker should be able to ask what the engine did, not infer
    // it from pixels — and a clamped window is the one failure here that looks
    // like a style choice.
    let lastWindows = null;

    // EXPORT WHAT IS ON SCREEN. Deliberately client-side, and the reason is the
    // same one that keeps the shader in one file: this renders from the exact
    // pipeline the look was approved from, because it IS that pipeline. There is
    // no second renderer that could disagree with the preview.
    //
    // WHAT THIS IS NOT: headless export. That belongs in the provider and does not
    // exist yet — see the decision note in the mission tree. Measured: the obvious
    // Node option is WebGL 1.0 and refuses our GLSL ES 3.00 shaders outright, so a
    // headless renderer costs either a browser on the box or a SECOND copy of the
    // shader. Rather than ship something that looks like export and quietly is not,
    // this saves the frame you are looking at and says so.
    const liveCanvas = () => (FAMILY && FAMILY.engine === 'canvas2d') ? c2d : canvas;

    function download(dataUrl, name) {
      const a = document.createElement('a');
      a.href = dataUrl; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function frameDataUrl() { return liveCanvas().toDataURL('image/png'); }

    // Wait until a render has actually drawn the intent identified by `gen`. The
    // bound exists to stop a hang, NOT to stand in for the signal — reaching it
    // throws, because capturing a frame we cannot prove is the right one is the
    // exact defect this replaces.
    function awaitRender(gen, bailAfterMs = 8000) {
      return new Promise((resolve, reject) => {
        const t0 = performance.now();
        const check = () => {
          if (lastDrawnGen >= gen) return resolve();
          if (performance.now() - t0 > bailAfterMs) {
            return reject(new Error('the renderer did not finish the requested frame in time — nothing was captured'));
          }
          requestAnimationFrame(check);
        };
        check();
      });
    }

    // EVERY LOOK ON ONE SHEET, which is the PRD's "presets produce visibly distinct
    // results, shown side by side" — and it is how an agent that has been nudging
    // knobs can actually SEE what the named looks do rather than take the schema's
    // word for it.
    async function contactSheet({ cols = 3, cell = 420, label = true } = {}) {
      const names = Object.keys(FAMILY.presets);
      const before = { ...params }, beforeCurve = curveSpec;
      const shots = [];
      try {
        // A SHEET OF NAMED LOOKS MUST SHOW THE NAMED LOOKS. With a curve running,
        // QA measured every cell matching the curve-modified render exactly while
        // the labels still claimed the bare preset — so the sheet could not be
        // used for the one comparison it exists to make. Curves are suspended for
        // the duration and restored with everything else.
        curveSpec = null;
        for (const name of names) {
          await applyPreset(name);
          // WAIT FOR THE RENDER, DO NOT GUESS AT IT. This replaced a fixed 260ms
          // sleep that produced a complete, correctly-labelled sheet whose cells
          // held the wrong looks on a slower machine.
          await awaitRender(paramGen);
          shots.push({ name, url: frameDataUrl() });
        }
      } finally {
        // Restore whatever was on screen. A tool that silently keeps the last
        // preset it rendered would lose the thing the user was working on.
        paramGen++; params = before; curveSpec = beforeCurve; syncInputs(); draw();
      }

      const imgs = await Promise.all(shots.map(({ name, url }) => new Promise((res, rej) => {
        const im = new Image(); im.onload = () => res({ name, im }); im.onerror = rej; im.src = url;
      })));
      const rows = Math.ceil(imgs.length / cols);
      const ar = imgs[0].im.height / imgs[0].im.width;
      const cw = cell, ch = Math.round(cell * ar), pad = 10, cap = label ? 26 : 0;
      const sheet = document.createElement('canvas');
      sheet.width = cols * (cw + pad) + pad;
      sheet.height = rows * (ch + cap + pad) + pad;
      const x = sheet.getContext('2d');
      x.fillStyle = '#0b0e13'; x.fillRect(0, 0, sheet.width, sheet.height);
      imgs.forEach(({ name, im }, i) => {
        const cx = pad + (i % cols) * (cw + pad), cy = pad + Math.floor(i / cols) * (ch + cap + pad);
        x.drawImage(im, cx, cy, cw, ch);
        if (label) {
          x.fillStyle = '#929cad'; x.font = '13px ui-monospace, monospace'; x.textBaseline = 'middle';
          x.fillText(name, cx + 2, cy + ch + cap / 2);
        }
      });
      return sheet.toDataURL('image/png');
    }

    // A cheap fingerprint of what is actually on screen. Lets a check assert that
    // a parameter CHANGED THE IMAGE, rather than only that the call returned —
    // which is the difference between a control that works and one that answers.
    function frameHash() {
      const w = 64, h = 64;
      const live = (FAMILY && FAMILY.engine === 'canvas2d') ? c2d : canvas;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(live, 0, 0, w, h);
      const d = c.getContext('2d').getImageData(0, 0, w, h).data;
      let a = 2166136261;
      for (let i = 0; i < d.length; i += 7) { a ^= d[i]; a = Math.imul(a, 16777619); }
      return (a >>> 0).toString(16);
    }

    $('#source').addEventListener('change', (e) => useSource(e.target.value));
    $('#reload').addEventListener('click', loadSources);
    $('#reset').addEventListener('click', applyDefaults);
    $('#saveframe').addEventListener('click', () => {
      download(frameDataUrl(), `effects-${familyId}-${Date.now()}.png`);
      say('saved the frame you are looking at');
    });
    $('#sheet').addEventListener('click', async () => {
      say('rendering every look…');
      try {
        download(await contactSheet(), `effects-${familyId}-looks.png`);
        say(`saved a sheet of all ${Object.keys(FAMILY.presets).length} looks`);
      } catch (e) { fail(`could not build the sheet: ${e.message}`); }
    });
    boot();
  </script>
</body>
</html>
