<!-- A shell on this machine (the Studio's own /terminal/), and, where the Studio serves it, the team's agents, each in its own tile (the
     Studio's own watch / type paths, one terminal per tile, from its list at /api/agents/terminals). The place says which are set up:
     on a Studio reached only from this computer the agents view is never served, and this page is the shell alone. #agents asks for
     the agents; with both set up, a switch shows either, and switching only hides the other (it stays connected). With neither a
     terminal of your own nor the agents view, the team's shared terminal opens. The words, the tile rules and what a read of the place
     means come from vendor/terminal/terminal.js. While a view is open the page reads the place again on a timer, on focus and when a
     frame reloads: a view the Studio no longer serves is removed, and a refused sign-in removes every view and says so. The agents'
     grid opens as many tiles as fit at a readable size and names the rest above it; a tile that leaves the list stays while it's
     pinned or typed in, or for a few seconds while it has the keyboard; a failed read of the list keeps the tiles and says so; a typing
     tile whose connection closes goes back to Watch. #agents&view=qitem:<id> shows one task's agents: a verified terminal is watched
     by default, and a member without a view yet offers Add view (the person's click). -->
