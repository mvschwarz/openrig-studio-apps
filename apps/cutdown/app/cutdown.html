<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CUTDOWN · punch the cuts you want</title>
<style>
  :root {
    /* dark value ladder — canon: app/shell/build-proof.html
       ground #121214 · card +5% · raised +12% · INVERT = solid white / #111.
       coral = needs-human/error · indigo = routing/links ·
       lockgreen = the locked (approved) data state ONLY. */
    --ink:#121214; --panel:rgba(255,255,255,.05); --edge:rgba(255,255,255,.16);
    --bone:rgba(255,255,255,.95); --body:rgba(255,255,255,.68);
    --dim:rgba(255,255,255,.52); --faint:rgba(255,255,255,.38);
    --raised:rgba(255,255,255,.12);
    --coral:#ff6b5a; --indigo:#8b93ff; --lockgreen:#7ea36f;
    --sans:Helvetica,"Helvetica Neue",Arial,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--ink); color:var(--bone);
    font-family:var(--sans); }
  #app { display:flex; height:100vh; }

  /* clip list */
  #clips { width:250px; min-width:250px; background:var(--panel);
    border-right:1px solid var(--edge); overflow-y:auto; }
  #clips h1 { font-size:12px; letter-spacing:4px; color:var(--dim);
    padding:16px 14px 8px; margin:0; }
  .clip { display:flex; justify-content:space-between; align-items:center;
    padding:8px 14px; cursor:pointer; color:var(--dim); font-size:12px;
    border-left:2px solid transparent; }
  .clip:hover { color:var(--bone); }
  .clip.active { color:#111; border-left-color:var(--bone);
    background:var(--bone); }
  .clip .n { font-variant-numeric:tabular-nums; }
  .clip .badge { color:var(--dim); font-size:11px; }
  .clip.active .badge { color:#111; }

  /* stage: a normal-proportioned player; the LIST is what grows with the
     window (product note: four fixed rows is too narrow; cuts should run down the screen) */
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #stagewrap { flex:0 0 auto; height:46vh; min-height:240px; display:flex;
    align-items:center; justify-content:center;
    background:#000; position:relative; }
  video { max-width:100%; max-height:100%; outline:none; }
  #inflag { position:absolute; left:14px; top:12px; color:var(--bone);
    font-size:12px; letter-spacing:2px; display:none; }

  /* controls */
  #controls { border-top:1px solid var(--edge); background:var(--panel);
    padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:2px; border:1px solid var(--edge);
    background:none; color:var(--bone); padding:10px 18px; letter-spacing:1.5px; }
  button:hover { border-color:var(--dim); }
  #btnIn { border-color:var(--bone); color:#111; background:var(--bone); font-weight:700; }
  #btnOut { border-color:var(--edge); color:var(--bone); font-weight:700; opacity:.45; }
  #btnOut.armed { opacity:1; background:var(--bone); color:#111; border-color:var(--bone); }
  .hint { color:var(--faint); font-size:11px; letter-spacing:.5px; }
  #note { flex:1; min-width:160px; background:var(--panel); border:1px solid var(--edge);
    border-radius:2px; color:var(--bone); font:inherit; font-size:12px; padding:9px 10px; }
  #note:focus { border-color:rgba(255,255,255,.20); }
  #note::placeholder { color:var(--faint); }
  #tc { color:var(--dim); font-variant-numeric:tabular-nums; font-size:13px; }

  /* markers/cuts panel: takes ALL remaining height — a tall browser shows
     a tall list */
  #markers { flex:1; min-height:150px; overflow-y:auto; border-top:1px solid var(--edge);
    background:var(--ink); padding:8px 16px; }
  .tabs { display:flex; gap:18px; margin:6px 0; align-items:baseline; }
  .tabbtn { font-size:11px; letter-spacing:3px; color:var(--faint); cursor:default; }
  .tabbtn.active { color:#111; background:var(--bone); }
  .filt { display:inline-flex; gap:0; margin-left:auto; }
  .filt button { font:inherit; font-size:9px; letter-spacing:1.5px; padding:3px 10px;
    background:none; border:1px solid var(--edge); color:var(--faint); cursor:pointer; }
  .filt button:first-child { border-radius:2px 0 0 2px; }
  .filt button:last-child { border-radius:0 2px 2px 0; border-left:0; }
  .filt button.on { color:#111; border-color:var(--bone); background:var(--bone); }
  .cut { display:flex; gap:12px; align-items:center; font-size:12px; padding:6px 0;
    border-bottom:1px dashed var(--edge); flex-wrap:wrap; }
  .cut .caret { color:var(--faint); cursor:pointer; width:12px; font-size:11px;
    user-select:none; transition:transform .12s; display:inline-block; }
  .cut .caret.open { transform:rotate(90deg); color:var(--dim); }
  .cut .g { width:12px; text-align:center; font-size:12px; }
  .cut .g.ok { color:var(--body); }
  .cut .g.busy { color:transparent; }
  .cut .g.busy::after { content:""; display:inline-block; width:8px; height:8px;
    vertical-align:middle; border:1.5px solid var(--faint); border-top-color:var(--bone);
    border-radius:50%; animation:cd-spin .7s linear infinite; }
  .cut .g.bad { color:var(--coral); }
  .cut .rng { color:var(--indigo); font-variant-numeric:tabular-nums; font-size:11px;
    cursor:pointer; white-space:nowrap; }
  .cut .rng:hover { color:var(--bone); }
  .cut .xtra { flex-basis:100%; display:none; gap:12px; align-items:center;
    padding:2px 0 4px 24px; }
  .cut .xtra.open { display:flex; flex-wrap:wrap; }
  .cut .xtra .info { color:var(--faint); font-size:10px; letter-spacing:.5px; }
  .cut .nm { color:var(--bone); cursor:pointer; }
  .cut .nm:hover { color:var(--indigo); }
  .cut .st { font-size:10px; letter-spacing:1px; padding:2px 8px; border-radius:2px;
    border:1px solid var(--edge); color:var(--dim); }
  .cut .st.ready { color:var(--body); border-color:var(--edge); }
  .cut .st.cutting { color:var(--dim); border-color:var(--edge); }
  .cut .st.failed { color:var(--coral); border-color:var(--coral); }
  .cut .retry { background:none; border:1px solid var(--coral); border-radius:2px;
    color:var(--coral); font:inherit; font-size:11px; padding:2px 8px; cursor:pointer; }
  .cut button { padding:4px 10px; font-size:10px; letter-spacing:1px; }
  /* version chips: label = a version on disk · click = WATCH it (INVERT) ·
     🔒 = LOCK it as the version the video uses (lock-green — the data state) */
  .vers { display:inline-flex; gap:5px; flex-wrap:wrap; }
  .ver { display:inline-flex; align-items:center; gap:5px; font-size:10px;
    letter-spacing:1px; padding:3px 8px; border:1px solid var(--edge);
    border-radius:2px; color:var(--dim); cursor:pointer; user-select:none; }
  .ver:hover { color:var(--bone); border-color:var(--dim); }
  .ver.on { color:#111; border-color:var(--bone); background:var(--bone); }
  .ver .lock { opacity:.28; font-size:10px; }
  .ver .lock:hover { opacity:.8; }
  .ver.lk { border-color:var(--lockgreen); }
  .ver.lk .lock { color:var(--lockgreen); opacity:1; }
  .ver.busy { cursor:default; color:var(--dim); border-color:var(--edge); }
  .ver.busy::after { content:""; display:inline-block; width:8px; height:8px;
    vertical-align:middle; margin-left:6px; border:1.5px solid var(--faint);
    border-top-color:var(--bone); border-radius:50%; animation:cd-spin .7s linear infinite; }
  .cut .picked { color:var(--lockgreen); font-size:10px; letter-spacing:1px; }
  .cut .del { color:var(--faint); cursor:pointer; opacity:.45; margin-left:auto; }
  .cut .del:hover { opacity:1; color:var(--coral); }
  .mk { display:flex; gap:12px; align-items:baseline; font-size:12px; padding:5px 0;
    border-bottom:1px dashed var(--edge); }
  .mk .rng { color:var(--indigo); font-variant-numeric:tabular-nums; cursor:pointer; }
  .mk .who { color:var(--faint); font-size:10px; }
  .mk .nt { color:var(--dim); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mk .del { color:var(--faint); cursor:pointer; opacity:.5; }
  .mk .del:hover { opacity:1; color:var(--coral); }
  #viewing { padding:4px 10px; font-size:11px; letter-spacing:1px; color:var(--body);
    background:var(--panel); border-bottom:1px solid var(--edge);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #viewing .kind { color:var(--dim); margin-right:8px; }
  /* playing = transient working/playback state, not the selected control: a
     RAISED row (not full INVERT) keeps every child legible on a dark surface and
     lets the inner .ver.on chip stay INVERT (white chip reads on the raised row).
     Avoids the white-on-white produced by a full invert.  */
  .cut.playing { background:var(--raised); border-color:rgba(255,255,255,.38); }
  .lathead { font-size:10px; letter-spacing:3px; color:var(--dim); margin:8px 0 2px; }
  .allhead { font-size:10px; letter-spacing:3px; color:var(--faint); margin:12px 0 2px; }
  .cut .st.new { color:#111; border-color:var(--bone); background:var(--bone); font-weight:700; }
  .cut .age { color:var(--faint); font-size:10px; }
  .cut .meta { color:var(--faint); font-size:10px; letter-spacing:.5px; }
  /* the smoothing dropdown: vertical, anchored under the + SMOOTH button */
  .smoothctl { position:relative; display:inline-block; }
  .levels { display:none; position:absolute; top:calc(100% + 4px); left:0; z-index:20;
    flex-direction:column; gap:2px; background:var(--panel);
    border:1px solid var(--edge); border-radius:2px; padding:4px;
    min-width:110px; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  .levels.open { display:flex; }
  .levels button { padding:5px 10px; font-size:10px; letter-spacing:1.5px; text-align:left;
    border:0; border-radius:2px; color:var(--body); }
  .levels button:hover { background:rgba(255,255,255,.08); color:var(--bone); }
  .cut .nt { color:var(--dim); flex:1; min-width:60px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .cut .nt.editable { cursor:text; }
  .cut .nt.editable:hover { color:var(--bone); text-decoration:underline dashed var(--faint); }
  .cut .nt.empty { color:var(--faint); }
  .noteedit { background:var(--panel); border:1px solid rgba(255,255,255,.20); border-radius:2px;
    color:var(--bone); font:inherit; font-size:11px; padding:3px 8px; flex:1; min-width:120px; }
  @keyframes cd-spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <nav id="clips"><h1>FOOTAGE</h1><div id="cliplist"></div></nav>
  <main id="main">
    <div id="stagewrap">
      <div id="inflag">● IN SET — punch OUT to close the cut</div>
      <div id="viewing">nothing loaded — pick a shot</div>
      <video id="v" controls preload="metadata"></video>
    </div>
    <div id="controls">
      <button id="btnIn" title="I">⌾ PUNCH IN <span class="hint">I</span></button>
      <button id="btnOut" title="O">⌾ PUNCH OUT <span class="hint">O</span></button>
      <span id="tc">00:00.0</span>
      <input id="note" placeholder="note (optional) — saved with the next punch-out; you can also add it later on the cut" />
      <span class="hint">I = in · O = out · space = play/pause · ←/→ = 2s</span>
    </div>
    <div id="markers">
      <div class="tabs">
        <span class="tabbtn active">CUTS <span id="cutcount"></span></span>
        <span class="filt">
          <button id="fAll" class="on">ALL</button><button id="fClip">THIS SHOT</button>
        </span>
      </div>
      <div id="cutlist"></div>
    </div>
  </main>
</div>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const v = $("v");
  let clips = [], active = null, pendingIn = null;

  const fmt = (s) => { const m = Math.floor(s/60), r = (s%60).toFixed(1).padStart(4,"0"); return `${String(m).padStart(2,"0")}:${r}`; };

  async function loadClips() {
    const r = await (await fetch("/api/clips")).json();
    clips = r.clips || [];
    const el = $("cliplist"); el.innerHTML = "";
    clips.forEach((c) => {
      const d = document.createElement("div");
      d.className = "clip" + (active === c.name ? " active" : "");
      d.innerHTML = `<span class="n">${c.name}</span>` + (c.markers ? `<span class="badge">${c.markers} ✂</span>` : "");
      d.onclick = () => activate(c.name);
      el.appendChild(d);
    });
  }

  // jump the punch view to a moment in a source rush (activating it first
  // if needed) — the merged list's range-click
  function jumpToSource(srcName, t) {
    const target = clips.find((c) => c.name.toLowerCase() === String(srcName || "").toLowerCase());
    if (!target) return;
    if (active !== target.name) {
      activate(target.name);
      v.addEventListener("loadedmetadata", () => { v.currentTime = t; v.play(); }, { once: true });
    } else { v.currentTime = t; v.play(); }
  }

  function activate(name) {
    active = name; pendingIn = null; nowPlaying = null;
    $("inflag").style.display = "none"; $("btnOut").classList.remove("armed");
    v.src = "/media/" + encodeURIComponent(name);
    $("viewing").innerHTML = `<span class="kind">SHOT</span>${name}`;
    refresh();
  }

  async function refresh() { await loadClips(); await loadCuts(); }

  async function punchIn() {
    if (!active) return;
    pendingIn = v.currentTime;
    $("inflag").style.display = "block"; $("btnOut").classList.add("armed");
  }
  async function punchOut() {
    if (!active || pendingIn == null || v.currentTime <= pendingIn) return;
    const note = $("note").value.trim(); $("note").value = "";
    await fetch("/api/markers", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ clip: active, in_s: pendingIn, out_s: v.currentTime, note }) });
    pendingIn = null;
    $("inflag").style.display = "none"; $("btnOut").classList.remove("armed");
    refresh();
  }

  $("btnIn").onclick = punchIn;
  $("btnOut").onclick = punchOut;
  v.addEventListener("timeupdate", () => { $("tc").textContent = fmt(v.currentTime || 0); });
  addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "i" || e.key === "I") { e.preventDefault(); punchIn(); }
    if (e.key === "o" || e.key === "O") { e.preventDefault(); punchOut(); }
    if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
    if (e.key === "ArrowRight") { v.currentTime += 2; }
    if (e.key === "ArrowLeft") { v.currentTime -= 2; }
  });

  // ---- the merged CUTS panel (markers + cuts = one lifecycle, one list)
  let watchState = {};   // cut file -> version FILE currently chosen to watch
  let nowPlaying = null;   // cut file currently in the viewer
  let expanded = new Set();   // cut files with the caret open
  let filterMode = "all";
  try { filterMode = localStorage.getItem("cutdown.filter") || "all"; } catch {}
  function setFilter(m) {
    filterMode = m;
    try { localStorage.setItem("cutdown.filter", m); } catch {}
    $("fAll").classList.toggle("on", m === "all");
    $("fClip").classList.toggle("on", m === "clip");
    loadCuts();
  }
  $("fAll").onclick = () => setFilter("all");
  $("fClip").onclick = () => setFilter("clip");
  const inFilter = (srcName) => filterMode === "all" ||
    (active && String(srcName || "").toLowerCase() === active.toLowerCase());

  function playCut(file, verFile, verLabel) {
    v.src = "/cutprev/" + encodeURIComponent(verFile || file);
    v.play();
    nowPlaying = file;
    watchState[file] = verFile || file;
    $("viewing").innerHTML = `<span class="kind">CUT · ${verLabel || "ORIGINAL"}</span>${file.replace(/^cut-/, "").replace(/\.mp4$/, "")}`;
    document.querySelectorAll("#cutlist .cut").forEach((el) => el.classList.toggle("playing", el.dataset.file === file));
  }

  // the user-facing smoothing dial: the user experiments, the level rides
  // the job into the backend, results come back labeled. Display note:
  // the tripod level shows as TRIPOD — "lock" (🔒) is reserved for the
  // curation act of choosing which version the video uses.
  const LEVELS = [["light", "LIGHT"], ["medium", "MEDIUM"], ["strong", "STRONG"], ["locked", "TRIPOD"]];
  const VER_LABEL = { original: "ORIGINAL", light: "LIGHT", medium: "MEDIUM",
    strong: "STRONG", locked: "TRIPOD", smoothed: "SMOOTHED" };
  const levelName = (meta) => !meta ? "" : (meta.level && VER_LABEL[meta.level]) || (meta.tripod ? "TRIPOD"
    : meta.smoothing <= 8 ? "LIGHT" : meta.smoothing <= 16 ? "MEDIUM" : "STRONG");
  function levelMenu(wrap, onPick) {
    const btn = wrap.querySelector("button");
    const menu = document.createElement("span");
    menu.className = "levels";
    LEVELS.forEach(([lv, label]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.title = lv === "locked"
        ? "for shots where the camera was MEANT to stay still — cancels hand tremor, cannot cancel real pans or walking"
        : `${label.toLowerCase()} smoothing`;
      b.onclick = (e) => { e.stopPropagation(); menu.classList.remove("open"); onPick(lv); };
      menu.appendChild(b);
    });
    wrap.appendChild(menu);
    btn.onclick = (e) => {
      e.stopPropagation();
      const was = menu.classList.contains("open");
      document.querySelectorAll(".levels.open").forEach((m) => m.classList.remove("open"));
      if (!was) menu.classList.add("open");
    };
  }
  addEventListener("click", () => document.querySelectorAll(".levels.open").forEach((m) => m.classList.remove("open")));
  const age = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? "just now" : m + "m ago"; };

  // notes are editable AFTER the cut exists — the primary flow is punch
  // fast while watching, then name clips on review. While an editor is
  // open the auto-refresh HOLDS (a re-render would destroy the input
  // mid-typing — the Safari "kicked out of edit mode" bug).
  let editingNote = false;
  function noteEditor(span, c) {
    span.classList.add("editable");
    span.title = "click to " + (c.note ? "edit" : "add") + " note";
    if (!c.note) { span.textContent = "+ note"; span.classList.add("empty"); }
    span.onclick = (e) => {
      e.stopPropagation();
      editingNote = true;
      const inp = document.createElement("input");
      inp.className = "noteedit"; inp.value = c.note || "";
      inp.placeholder = "what is this cut?";
      span.replaceWith(inp); inp.focus();
      inp.onkeydown = (ev) => {
        if (ev.key === "Enter") inp.blur();
        if (ev.key === "Escape") { inp.dataset.cancel = "1"; inp.blur(); }
      };
      inp.onblur = async () => {
        editingNote = false;
        if (inp.dataset.cancel !== "1" && inp.value.trim() !== (c.note || "")) {
          await fetch("/api/cut-note", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ clip: c.file, note: inp.value.trim() }) });
        }
        loadCuts();
      };
    };
  }

  async function loadCuts() {
    if (editingNote) return;   // never re-render an open note editor away
    const r = await (await fetch("/api/cuts")).json();
    $("cutcount").textContent = r.cuts.length ? "(" + r.cuts.length + ")" : "";
    const el = $("cutlist"); el.innerHTML = "";

    // LATEST strip: the thing you just did, pinned on top so it never gets
    // lost in the name-sorted list below
    const recent = (r.cuts || []).map((c) => {
      const cutT = Date.parse(c.cut_at || 0) || 0, stabT = Date.parse(c.stab_at || 0) || 0;
      return { c, t: Math.max(cutT, stabT), what: c.stabilized && stabT >= cutT ? "smoothed" : "cut" };
    }).filter((x) => x.t && Date.now() - x.t < 30 * 60 * 1000)
      .sort((a, b) => b.t - a.t).slice(0, 3);
    if (recent.length) {
      const h = document.createElement("div"); h.className = "lathead"; h.textContent = "LATEST"; el.appendChild(h);
      recent.forEach(({ c, t, what }) => {
        const d = document.createElement("div");
        d.className = "cut" + (c.file === nowPlaying ? " playing" : "");
        // for a fresh smooth, target the NEWEST smoothed version
        const smoothVers = (c.versions || []).filter((x) => x.file && x.key !== "original");
        const newest = smoothVers.sort((a, b) => (b.at || "").localeCompare(a.at || ""))[0];
        const lvl = what === "smoothed" && newest ? (newest.key === "smoothed" ? levelName(newest.meta) || "SMOOTHED" : VER_LABEL[newest.key]) : "";
        d.innerHTML = `<span class="st new">JUST ${what === "smoothed" ? "SMOOTHED" + (lvl ? "·" + lvl : "") : "CUT"}</span>
          <span class="nm" title="play the ${what === "smoothed" ? "smoothed result" : "new cut"}">${c.file.replace(/^cut-/, "").replace(/\.mp4$/, "")}</span>
          <span class="nt">${c.note || ""}</span><span class="age">${age(t)}</span>`;
        d.querySelector(".nm").onclick = () => {
          if (what === "smoothed" && newest) playCut(c.file, newest.file, lvl);
          else playCut(c.file, c.file, "ORIGINAL");
        };
        noteEditor(d.querySelector(".nt"), c);
        el.appendChild(d);
      });
      const h2 = document.createElement("div"); h2.className = "allhead"; h2.textContent = "ALL CUTS"; el.appendChild(h2);
    }

    (r.cutting || []).filter((c) => inFilter(c.clip)).forEach((c) => {
      const d = document.createElement("div");
      d.className = "cut";
      d.innerHTML = `<span class="caret" style="visibility:hidden">▸</span><span class="g busy" title="cutting from the original">◌</span>
        <span class="rng" title="jump the shot to this moment">${fmt(c.in_s)}→${fmt(c.out_s)}</span>
        <span class="nm">${c.clip.replace(/\.(mp4|MP4)$/, "")}</span><span class="nt">cutting…</span>
        <span class="who">${c.by}</span><span class="del" title="cancel this cut (removes the punch)">✕</span>`;
      d.querySelector(".rng").onclick = () => jumpToSource(c.clip, c.in_s);
      d.querySelector(".del").onclick = async () => {
        if (!confirm("Cancel this cut? The punch marker is removed; the original footage is never touched.")) return;
        await fetch("/api/markers", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ clip: c.clip, deleted: true, ref: c.marker }) });
        loadCuts();
      };
      el.appendChild(d);
    });
    (r.failed || []).filter((c) => inFilter(c.clip)).forEach((c) => {
      const d = document.createElement("div");
      d.className = "cut";
      d.innerHTML = `<span class="caret" style="visibility:hidden">▸</span><span class="g bad" title="${(c.error || "cut failed").replace(/"/g, "&quot;")}">✕</span>
        <span class="rng">${fmt(c.in_s)}→${fmt(c.out_s)}</span>
        <span class="nm">${c.clip.replace(/\.(mp4|MP4)$/, "")}</span><span class="nt">cut failed</span>
        <button class="retry">RETRY</button><span class="who">${c.by}</span>`;
      d.querySelector(".retry").onclick = async () => {
        await fetch("/api/cut-retry", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ tag: c.tag }) });
        loadCuts();
      };
      el.appendChild(d);
    });
    (r.cuts || []).filter((c) => inFilter(c.src)).forEach((c) => {
      const d = document.createElement("div");
      d.className = "cut" + (c.file === nowPlaying ? " playing" : "");
      d.dataset.file = c.file;
      const isOpen = expanded.has(c.file);
      d.innerHTML = `<span class="caret ${isOpen ? "open" : ""}" title="more">▸</span>
        <span class="g ok" title="ready">●</span>
        <span class="rng" title="jump the shot to this moment">${c.in_s != null ? fmt(c.in_s) + "→" + fmt(c.out_s) : ""}</span>
        <span class="nm" title="play">${c.file.replace(/^cut-/, "").replace(/\.mp4$/, "")}</span>
        <span class="nt">${c.note || ""}</span><span class="vers"></span>
        <span class="smoothctl"><button class="stab" title="generate another version of this cut">+ SMOOTH ▾</button></span>
        <span class="del" title="delete (archived, restorable)">✕</span>
        <div class="xtra ${isOpen ? "open" : ""}">
          <button class="dlfull" title="download the full-res master of the version you're watching (big file — for Final Cut etc.)">⇓ MASTER</button>
          <button class="dllite" title="download the lightweight preview of the version you're watching">⇓ PREVIEW</button>
          <span class="info">${c.by}${c.cut_at ? " · cut " + c.cut_at.slice(0, 16).replace("T", " ") : ""}${c.src ? " · from " + c.src : ""}</span>
        </div>`;

      // version chips: click = watch · ○/◉ = lock as the version the video uses
      const versEl = d.querySelector(".vers");
      const watched = watchState[c.file] || c.file;
      (c.versions || []).forEach((ver) => {
        const chip = document.createElement("span");
        if (ver.queued) {
          chip.className = "ver busy";
          chip.textContent = `${VER_LABEL[ver.key] || ver.key} ${ver.progress != null ? ver.progress + "%" : "…"}`;
          versEl.appendChild(chip);
          return;
        }
        const label = ver.key === "smoothed" ? (levelName(ver.meta) || "SMOOTHED") : (VER_LABEL[ver.key] || ver.key);
        const isLocked = (c.pick || "original") === ver.key;
        chip.className = "ver" + (watched === ver.file ? " on" : "") + (isLocked ? " lk" : "");
        chip.innerHTML = `${label}<span class="lock" title="${isLocked ? "the locked version — the one the video uses" : "lock this version as the one the video uses (nothing is deleted)"}">${isLocked ? "◉" : "○"}</span>`;
        chip.title = "watch " + label.toLowerCase();
        chip.onclick = () => playCut(c.file, ver.file, label);
        chip.querySelector(".lock").onclick = async (e) => {
          e.stopPropagation();
          await fetch("/api/pick", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ clip: c.file, choice: ver.key }) });
          loadCuts();
        };
        versEl.appendChild(chip);
      });

      d.querySelector(".caret").onclick = () => {
        if (expanded.has(c.file)) expanded.delete(c.file); else expanded.add(c.file);
        d.querySelector(".caret").classList.toggle("open");
        d.querySelector(".xtra").classList.toggle("open");
      };
      d.querySelector(".rng").onclick = () => { if (c.in_s != null) jumpToSource(c.src, c.in_s); };
      d.querySelector(".dlfull").onclick = () => location.href = "/master/" + encodeURIComponent(watchState[c.file] || c.file);
      d.querySelector(".dllite").onclick = () => location.href = "/cutprev/" + encodeURIComponent(watchState[c.file] || c.file) + "?dl=1";
      d.querySelector(".del").onclick = async () => {
        if (!confirm("Delete this cut? It moves to the archive (restorable), the original footage is never touched.")) return;
        await fetch("/api/cut-delete", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ clip: c.file }) });
        loadCuts();
      };
      d.querySelector(".nm").onclick = () => {
        const wf = watchState[c.file] || c.file;
        const wv = (c.versions || []).find((x) => x.file === wf);
        playCut(c.file, wf, wv ? (wv.key === "smoothed" ? levelName(wv.meta) || "SMOOTHED" : VER_LABEL[wv.key]) : "ORIGINAL");
      };
      noteEditor(d.querySelector(".nt"), c);
      levelMenu(d.querySelector(".smoothctl"), async (lv) => {
        const exists = (c.versions || []).some((x) => x.key === lv && x.file);
        if (exists && !confirm(`A ${VER_LABEL[lv]} version already exists — regenerate it? (the current one is archived)`)) return;
        await fetch("/api/stabilize", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ clip: c.file, level: lv }) });
        loadCuts();
      });
      el.appendChild(d);
    });
  }
  setInterval(() => { if (!editingNote && $("cutlist").style.display !== "none") loadCuts(); }, 12000);

  await loadClips();
  $("fAll").classList.toggle("on", filterMode === "all");
  $("fClip").classList.toggle("on", filterMode === "clip");
  if (clips.length) activate(clips[0].name);
})();
</script>
</body>
</html>
